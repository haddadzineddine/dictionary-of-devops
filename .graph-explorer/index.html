<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of DevOps — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of DevOps</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of DevOps","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Delivery","Containers","Kubernetes","Infrastructure as Code","Release Strategies","Supply Chain"],"terms":[{"name":"Trunk-based development","section":0,"description":"A branching model where everyone merges small changes into one shared branch at least daily, keeping integration problems small.","body":"\u003cp>Trunk-based development is a branching model in which all developers merge small changes into one shared branch, called the trunk (usually \u003ccode>main\u003c/code>), at least once a day. Work happens directly on the trunk or on a \u003ca href=\"#Feature%20branch\" data-term=\"Feature branch\">feature branch\u003c/a> that lives for a day or two. The trunk is kept in a state that could be released at any time.\u003c/p>\u003cp>The model addresses a familiar failure. Two developers work separately for three weeks, each with passing tests, then spend days resolving conflicts because both changed the same modules. Each branch worked alone, but the combination was never tested until the merge. Merging daily keeps each conflict small, and it makes \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">continuous integration\u003c/a> possible because there is one line of code to integrate against.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Long-lived branches\u003c/th>\u003cth>Trunk-based development\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Branch lifetime\u003c/td>\u003ctd>Weeks or months\u003c/td>\u003ctd>Hours to a couple of days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merge size\u003c/td>\u003ctd>Large\u003c/td>\u003ctd>Small\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conflicts\u003c/td>\u003ctd>Found late, in bulk\u003c/td>\u003ctd>Found early, one at a time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unfinished work\u003c/td>\u003ctd>Hidden on the branch\u003c/td>\u003ctd>Merged, but switched off\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Unfinished work is merged behind a \u003ca href=\"#Feature%20flag\" data-term=\"Feature flag\">feature flag\u003c/a>, which keeps the code inactive in production. Another option is branch by abstraction, where a new implementation is built behind an existing interface and swapped in once ready. Database changes follow \u003ca href=\"#Expand%20and%20contract\" data-term=\"Expand and contract\">expand and contract\u003c/a> for the same reason: each small step must be safe to ship alone.\u003c/p>\u003cp>The model depends on supporting habits. A fast automated \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> must run on every change, reviews must happen within hours, and a broken trunk must be fixed or reverted before other work lands. Without those habits, frequent merges spread breakage to everyone.\u003c/p>","avoid":"","usage":["My branch is three weeks old and the rebase has forty conflicts.","That's what trunk-based development avoids. Split it up, merge the refactor today, and put the new checkout behind a flag."],"out":[1,2,9,52,5]},{"name":"Feature branch","section":0,"description":"A Git branch that holds one change, such as a feature or bug fix, until it is reviewed and merged into the main branch.","body":"\u003cp>A feature branch is a Git branch created from the main branch to hold one change, such as a new endpoint or a bug fix, until it is reviewed and merged back. It lets a developer commit unfinished work without affecting anyone else, and it gives reviewers a single diff to read, usually through a pull request (a request to review and merge a branch).\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Developer\u003c/td>\u003ctd>Creates the branch from the latest main\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Developer\u003c/td>\u003ctd>Commits and pushes the change\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a>\u003c/td>\u003ctd>Builds and tests the branch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Reviewer\u003c/td>\u003ctd>Reads the diff and requests changes or approves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Developer\u003c/td>\u003ctd>Updates from main and resolves any conflicts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Merge tool\u003c/td>\u003ctd>Merges the change and deletes the branch\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The common problem is a branch that lives too long. Main moves on while the branch stands still, so the diff grows, reviewers put it off, and the final merge brings conflicts that are tedious and easy to get wrong.\u003c/p>\u003cp>A branch can also pass every check and still break main after merging, because the checks ran against an older copy of main. This is a semantic conflict: Git merges the text cleanly, but one side renamed a function the other side started calling.\u003c/p>\u003cp>Two practices reduce the risk. Keeping branches to a day or two, as in \u003ca href=\"#Trunk-based%20development\" data-term=\"Trunk-based development\">trunk-based development\u003c/a>, limits how far they can drift. A merge queue, which tests each pull request against the latest main plus the changes ahead of it before merging, catches semantic conflicts before they land. Large work can be split into small merges by hiding incomplete behaviour behind a \u003ca href=\"#Feature%20flag\" data-term=\"Feature flag\">feature flag\u003c/a>.\u003c/p>","avoid":"","usage":["Both PRs were green, so why is main failing?","Your feature branch was tested before Sam's rename landed. Git merged them without a conflict, but your code still calls the old function. We should turn on the merge queue."],"out":[2,0,9]},{"name":"Continuous integration","section":0,"description":"The practice of merging work into a shared branch frequently, with an automated build and tests running on every change.","body":"\u003cp>Continuous integration (CI) is the practice of merging every developer's work into a shared branch frequently, with an automated build and test run on each change. The term describes a team habit as well as tooling. A team with a CI server whose branches stay unmerged for weeks has automated tests, but it is not integrating continuously.\u003c/p>\u003cp>CI addresses the &quot;works on my machine&quot; problem. A change passes on a laptop with a particular runtime version, a leftover environment variable, and a cached dependency, then fails for everyone else. A CI run starts from a clean checkout in a defined environment, so hidden assumptions show up as failures within minutes of the push.\u003c/p>\u003cp>A \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> usually orders its checks so that fast ones fail first:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Check\u003c/th>\u003cth>What it catches\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Lint and format\u003c/td>\u003ctd>Style problems and simple mistakes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compile or build\u003c/td>\u003ctd>Syntax errors, type errors, missing imports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unit tests\u003c/td>\u003ctd>Broken logic in individual functions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integration tests\u003c/td>\u003ctd>Components that fail when run together\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Packaging\u003c/td>\u003ctd>A \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a> that cannot be produced\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Three habits keep CI useful. First, a failing main branch is fixed or reverted before other work continues, because everyone branching from it inherits the failure. Second, the run stays fast enough that people wait for the result instead of switching tasks. Third, flaky tests, which pass or fail at random on the same code, are fixed or quarantined. When a suite is flaky, people learn to press &quot;re-run&quot; until it goes green, and real failures start being dismissed as noise.\u003c/p>\u003cp>CI stops at verifying the change. Getting the verified change to users is the job of \u003ca href=\"#Continuous%20delivery\" data-term=\"Continuous delivery\">continuous delivery\u003c/a> or \u003ca href=\"#Continuous%20deployment\" data-term=\"Continuous deployment\">continuous deployment\u003c/a>.\u003c/p>","avoid":"","usage":["CI failed on my PR but the test passes locally.","Check the Node version in the workflow. CI runs from a clean checkout, so it won't have whatever you installed globally."],"out":[5,6,3,4]},{"name":"Continuous delivery","section":0,"description":"Keeping every change that passes the pipeline ready to release, with a human deciding when it goes to production.","body":"\u003cp>Continuous delivery is the practice of keeping every change that passes the automated \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> in a state that can be released to production at any time. The final production deployment is a human decision, usually a button press or an approved promotion. The abbreviation CD is ambiguous because it also stands for \u003ca href=\"#Continuous%20deployment\" data-term=\"Continuous deployment\">continuous deployment\u003c/a>, which removes that human step.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Practice\u003c/th>\u003cth>Build and test\u003c/th>\u003cth>Ready to release\u003c/th>\u003cth>Production deploy\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">Continuous integration\u003c/a>\u003c/td>\u003ctd>Automatic\u003c/td>\u003ctd>Not guaranteed\u003c/td>\u003ctd>Separate process\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Continuous delivery\u003c/td>\u003ctd>Automatic\u003c/td>\u003ctd>Always\u003c/td>\u003ctd>Manual decision\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Continuous deployment\u003c/td>\u003ctd>Automatic\u003c/td>\u003ctd>Always\u003c/td>\u003ctd>Automatic\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The problem it addresses is the large, stressful release. When a team ships every few months, each release bundles many unrelated changes, needs a code freeze, and often runs late into the evening. If production breaks, nobody can tell which of the many commits caused it. Shipping small batches means each release contains little, so a failure is easier to trace and to reverse with a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>.\u003c/p>\u003cp>Continuous delivery needs a few things in place. Each change produces one versioned \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a>, and that same artifact moves through test, staging, and production. Deployment is scripted, so the production deployment uses the steps already exercised in staging. Configuration lives outside the artifact, so one build can run in every environment.\u003c/p>\u003cp>The manual gate is useful where release timing is a business or compliance decision: a launch tied to an announcement, a required sign-off, or a customer maintenance window. The gate should be a decision only. If pressing the button also requires a runbook of manual steps, the team does not yet have continuous delivery.\u003c/p>","avoid":"","usage":["Can we ship the pricing fix this afternoon, or do we wait for the release train?","We have continuous delivery now. Build 412 already passed staging, so someone only needs to approve the production step."],"out":[5,4,2,51,6]},{"name":"Continuous deployment","section":0,"description":"Automatically releasing every change that passes the pipeline to production, with no human approval step.","body":"\u003cp>Continuous deployment is the practice of automatically releasing every change that passes the \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> to production, with no human approval step. It extends \u003ca href=\"#Continuous%20delivery\" data-term=\"Continuous delivery\">continuous delivery\u003c/a>, where a person still chooses when to deploy. Under continuous deployment, merging to the main branch is the decision to ship.\u003c/p>\u003cp>Removing the human gate moves the responsibility for safety into automation. A bad change that the checks miss can reach users within minutes of being merged, so the safeguards have to exist before the gate is removed:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Safeguard\u003c/th>\u003cth>What it provides\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Reliable automated tests\u003c/td>\u003ctd>Confidence that a green run means the change works\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Canary%20release\" data-term=\"Canary release\">Canary release\u003c/a>\u003c/td>\u003ctd>Exposes a small share of traffic to the change first\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Health-based promotion\u003c/td>\u003ctd>Stops the rollout when error rate or latency worsens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Automated \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>\u003c/td>\u003ctd>Returns to the previous version without waiting for a person\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Feature%20flag\" data-term=\"Feature flag\">Feature flag\u003c/a>\u003c/td>\u003ctd>Ships code switched off and enables it separately\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Feature flags matter here because they separate deploying from releasing. Code can reach production on every merge while the behaviour stays off until product, support, and documentation are ready. Without flags, every merged change becomes visible to users, and developers start holding back merges, which recreates long-lived branches.\u003c/p>\u003cp>Database changes need particular care. An automated deploy will run a schema change as readily as a code change, and a destructive migration cannot be undone by redeploying old code. Teams use \u003ca href=\"#Expand%20and%20contract\" data-term=\"Expand and contract\">expand and contract\u003c/a> so each deploy stays compatible with the version before it.\u003c/p>\u003cp>Continuous deployment does not suit every product. Mobile apps pass through store review, firmware is hard to update once shipped, and some regulated environments require a recorded human approval. Those teams usually stop at continuous delivery.\u003c/p>","avoid":"","usage":["Who approved this going to production? I only merged it ten minutes ago.","Nobody has to. We use continuous deployment, so the merge was the approval. If the canary's error rate had climbed, it would have rolled itself back."],"out":[5,3,49,51,9,52]},{"name":"Pipeline","section":0,"description":"An automated sequence of build, test, and release steps that runs when code changes, defined in a file stored with the code.","body":"\u003cp>A pipeline is an automated sequence of steps that takes a code change from commit to a tested, packaged, and possibly deployed result. Pipelines are usually defined in a file stored with the code. A runner, which is a machine that executes the work, starts one when an event occurs, such as a push or a merged pull request.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Trigger\u003c/td>\u003ctd>The event that starts a run\u003c/td>\u003ctd>Push to \u003ccode>main\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stage\u003c/td>\u003ctd>An ordered group of jobs\u003c/td>\u003ctd>Test\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Job\u003c/td>\u003ctd>A set of steps on one runner\u003c/td>\u003ctd>Unit tests on Node 22\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Step\u003c/td>\u003ctd>A single command or action\u003c/td>\u003ctd>\u003ccode>npm test\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A minimal definition in GitHub Actions syntax:\u003c/p>\u003cpre>\u003ccode>on: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm test\u003c/code>\u003c/pre>\u003cp>A typical pipeline supports \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">continuous integration\u003c/a> in its early stages, then produces a \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a>, publishes it to an \u003ca href=\"#Artifact%20registry\" data-term=\"Artifact registry\">artifact registry\u003c/a>, and deploys it through environments.\u003c/p>\u003cp>Slow pipelines are a common complaint. When a run takes forty minutes, developers batch up changes, stop watching results, and lose context before a failure comes back. The usual fixes are to run cheap checks first so failures appear early, cache dependencies between runs, split tests across parallel jobs, and run expensive suites only where they are relevant.\u003c/p>\u003cp>A job can pass locally and fail in the pipeline. Runners start from a clean environment, so anything that depended on a globally installed tool, a local file, or an unset environment variable breaks there. Treat that failure as information about a hidden dependency.\u003c/p>\u003cp>Pipelines often hold credentials that can publish packages or change production, which makes them an attack target in the \u003ca href=\"#Software%20supply%20chain\" data-term=\"Software supply chain\">software supply chain\u003c/a>. Limit each job's permissions, and do not expose secrets to runs triggered by untrusted pull requests.\u003c/p>","avoid":"","usage":["The pipeline's been stuck on integration tests for half an hour again.","Move lint and unit tests ahead of them so bad commits fail in two minutes, then split the integration suite across four jobs."],"out":[2,6,7,53]},{"name":"Build artifact","section":0,"description":"The packaged output of a build, such as a binary, archive, or container image, that is versioned and deployed.","body":"\u003cp>A build artifact is the packaged output of a build: the file or bundle that actually gets deployed. Depending on the stack, it might be a compiled binary, a Java JAR, a zip of bundled JavaScript, a Python wheel, or a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>. The artifact is produced once by the \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a>, given a version, and stored in an \u003ca href=\"#Artifact%20registry\" data-term=\"Artifact registry\">artifact registry\u003c/a>.\u003c/p>\u003cp>The rule that follows is &quot;build once, deploy many&quot;. The same artifact moves from test to staging to production, and only its configuration changes between environments. If each environment builds from source separately, the builds can differ. A dependency range may resolve to a newer release, a base image may have changed, or the compiler on one runner may differ. This produces a confusing failure: staging passed, production is broken, and the source commit is identical in both.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>What staging tested\u003c/th>\u003cth>What production runs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Rebuild per environment\u003c/td>\u003ctd>Build A from commit \u003ccode>abc\u003c/code>\u003c/td>\u003ctd>Build B from commit \u003ccode>abc\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Promote one artifact\u003c/td>\u003ctd>Build A from commit \u003ccode>abc\u003c/code>\u003c/td>\u003ctd>Build A from commit \u003ccode>abc\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Keeping one artifact across environments has consequences for how it is built. Environment-specific values such as database URLs must be supplied at runtime through environment variables or mounted files. Credentials must not be baked in, because anyone who can download the artifact could read them.\u003c/p>\u003cp>An artifact should be traceable. Record the commit it came from, its version, and a checksum or digest (a hash of its contents) so you can prove that what is running is what was tested. An \u003ca href=\"#SBOM\" data-term=\"SBOM\">SBOM\u003c/a> can be published alongside it to list what it contains. Keep previous artifacts available, because a fast \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> depends on redeploying an earlier one instead of rebuilding it under pressure.\u003c/p>","avoid":"","usage":["Staging is fine but prod throws an import error on the same commit.","Are we rebuilding for each environment? Promote the build artifact that passed staging instead, so a dependency can't shift between the two."],"out":[11,5,7,55,51]},{"name":"Artifact registry","section":0,"description":"A versioned store for build outputs and packages that pipelines publish to and deployments pull from.","body":"\u003cp>An artifact registry is a server that stores versioned build outputs and packages, so that \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipelines\u003c/a> can publish to it and deployments can pull from it. It may hold npm packages, Maven JARs, Python wheels, \u003ca href=\"#Helm\" data-term=\"Helm\">Helm\u003c/a> charts, and \u003ca href=\"#Container%20image\" data-term=\"Container image\">container images\u003c/a>. JFrog Artifactory, Sonatype Nexus, and GitHub Packages are examples. A \u003ca href=\"#Container%20registry\" data-term=\"Container registry\">container registry\u003c/a> is the same idea specialised for images.\u003c/p>\u003cp>Registries commonly serve three kinds of repository:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Contains\u003c/th>\u003cth>Used for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hosted\u003c/td>\u003ctd>Your own \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifacts\u003c/a>\u003c/td>\u003ctd>Publishing internal packages and releases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Proxy\u003c/td>\u003ctd>Cached copies from a public registry\u003c/td>\u003ctd>Faster builds, tolerance of upstream outages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Virtual\u003c/td>\u003ctd>One URL combining hosted and proxy\u003c/td>\u003ctd>Simple client configuration\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A proxy repository addresses a failure many teams meet once. The public package registry has an outage, or a maintainer removes a package, and every build fails even though nobody changed any code. With a proxy in front, versions fetched earlier are still served from the cache.\u003c/p>\u003cp>A proxy also needs careful configuration. If a build looks up an internal package name and the registry also checks public sources, an attacker can publish a package with the same name and a higher version number. This is called dependency confusion, and it is a \u003ca href=\"#Software%20supply%20chain\" data-term=\"Software supply chain\">software supply chain\u003c/a> risk. Scope internal names so that they resolve only to the hosted repository.\u003c/p>\u003cp>Published versions should be immutable. If \u003ccode>2.3.1\u003c/code> can be overwritten, two deployments of the same version can contain different code, and any recorded checksum stops matching. Retention rules need similar thought. Storage grows quickly, so old versions get cleaned up, but a policy that deletes by age can remove the version you need for a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>. Exclude anything currently deployed or recently released.\u003c/p>","avoid":"","usage":["The rollback failed with a 404 on the old package.","The artifact registry's cleanup job deleted everything older than 30 days. Change the policy to keep the last ten releases regardless of age."],"out":[5,35,11,17,6,53,51]},{"name":"Semantic versioning","section":0,"description":"A MAJOR.MINOR.PATCH version format where each number signals whether a release breaks, extends, or fixes the public API.","body":"\u003cp>Semantic versioning (SemVer) is a version number format, \u003ccode>MAJOR.MINOR.PATCH\u003c/code>, where each part tells consumers what kind of change a release contains. It applies to a declared public API, meaning whatever other code is expected to depend on.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Example\u003c/th>\u003cth>Increment when\u003c/th>\u003cth>Safe to adopt automatically?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MAJOR\u003c/td>\u003ctd>\u003ccode>1.4.2\u003c/code> → \u003ccode>2.0.0\u003c/code>\u003c/td>\u003ctd>A change breaks existing consumers\u003c/td>\u003ctd>No, read the release notes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MINOR\u003c/td>\u003ctd>\u003ccode>1.4.2\u003c/code> → \u003ccode>1.5.0\u003c/code>\u003c/td>\u003ctd>Functionality is added compatibly\u003c/td>\u003ctd>Usually\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PATCH\u003c/td>\u003ctd>\u003ccode>1.4.2\u003c/code> → \u003ccode>1.4.3\u003c/code>\u003c/td>\u003ctd>A bug is fixed compatibly\u003c/td>\u003ctd>Usually\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Incrementing a number resets those to its right. Two suffixes extend the format. A pre-release such as \u003ccode>2.0.0-rc.1\u003c/code> sorts before \u003ccode>2.0.0\u003c/code>. Build metadata such as \u003ccode>2.0.0+abc123\u003c/code> is ignored when comparing versions.\u003c/p>\u003cp>Version ranges in package managers rely on these promises. In npm, \u003ccode>^1.4.2\u003c/code> accepts anything below \u003ccode>2.0.0\u003c/code>, and \u003ccode>~1.4.2\u003c/code> accepts anything below \u003ccode>1.5.0\u003c/code>. Versions below \u003ccode>1.0.0\u003c/code> are treated differently, because the specification says anything may change during initial development. For that reason \u003ccode>^0.4.2\u003c/code> only accepts \u003ccode>0.4.x\u003c/code>.\u003c/p>\u003cp>SemVer is a statement of intent by the maintainer, and no tool enforces it. A library can publish a &quot;patch&quot; that changes behaviour you relied on, and your build breaks on a Monday morning with no change in your own code. Sometimes the maintainer considers the old behaviour a bug, while you considered it a feature. This is the reason to commit a lockfile and use \u003ca href=\"#Dependency%20pinning\" data-term=\"Dependency pinning\">dependency pinning\u003c/a>, so that upgrades happen deliberately and go through \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">continuous integration\u003c/a>.\u003c/p>\u003cp>Applications that have no consumers of their API get less value from SemVer. A deployed web service is often better identified by a commit hash or build number, and SemVer is kept for libraries, APIs, and \u003ca href=\"#Helm\" data-term=\"Helm\">Helm\u003c/a> charts.\u003c/p>","avoid":"","usage":["It's only a patch bump, so I merged it without testing.","Semantic versioning is a promise, not a guarantee. That patch changed the date parser and broke invoices, so let the upgrade run through CI first."],"out":[54,2,35]},{"name":"Feature flag","section":0,"description":"A runtime switch that turns code paths on or off without a deploy, separating shipping code from releasing behaviour.","body":"\u003cp>A feature flag is a runtime switch that turns a code path on or off without a new deployment. The code ships to production inside a conditional, and a configuration value or flag service decides who gets which path. This separates deploying code from releasing behaviour.\u003c/p>\u003cpre>\u003ccode>if (flags.isEnabled(&quot;new-checkout&quot;, { userId })) {\n  return renderNewCheckout();\n}\nreturn renderOldCheckout();\u003c/code>\u003c/pre>\u003cp>Flags come in several kinds, with different lifespans:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Expected lifespan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Release\u003c/td>\u003ctd>Hide unfinished or unreleased work\u003c/td>\u003ctd>Days to weeks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Experiment\u003c/td>\u003ctd>Compare variants in an A/B test\u003c/td>\u003ctd>Weeks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operational\u003c/td>\u003ctd>Kill switch to disable a costly feature\u003c/td>\u003ctd>Long-term\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Permission\u003c/td>\u003ctd>Enable features for a plan or customer\u003c/td>\u003ctd>Long-term\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Release flags make \u003ca href=\"#Trunk-based%20development\" data-term=\"Trunk-based development\">trunk-based development\u003c/a> practical, because incomplete work can merge while switched off. They also allow a gradual rollout by user percentage, and turning a flag off is usually much faster than a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> because nothing is rebuilt or redeployed. A \u003ca href=\"#Dark%20launch\" data-term=\"Dark launch\">dark launch\u003c/a> often relies on one.\u003c/p>\u003cp>The cost is accumulated flags. Each boolean doubles the possible code paths in principle, and nobody tests every combination. A common incident is a flag that has been &quot;on&quot; for two years: someone removes it from the flag service, the default evaluates to false, and production falls back to an old code path that no longer works. Give each release flag an owner and a removal date, and delete the conditional once the rollout is complete.\u003c/p>\u003cp>Decide what happens when the flag service is unreachable. Clients should cache the last known values and define a safe default for each flag, so that an outage in the flag service does not change application behaviour.\u003c/p>","avoid":"","usage":["The new search is causing timeouts. Do we need to roll back?","No, it's behind a feature flag. Turn it off for everyone now, and we can look at the query tomorrow."],"out":[0,51,50]},{"name":"Container","section":1,"description":"A process isolated by Linux kernel features, with its own filesystem and limits, sharing the host's kernel.","body":"\u003cp>A container is a running process, or group of processes, that the Linux kernel isolates from the rest of the machine. It gets its own filesystem from a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>, its own view of the system through \u003ca href=\"#Linux%20namespace\" data-term=\"Linux namespace\">Linux namespaces\u003c/a>, and resource limits through \u003ca href=\"#cgroup\" data-term=\"cgroup\">cgroups\u003c/a>. It shares the host's kernel, which is the main difference from a virtual machine.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Container\u003c/th>\u003cth>Virtual machine\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Kernel\u003c/td>\u003ctd>Shares the host's kernel\u003c/td>\u003ctd>Runs its own kernel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Boundary\u003c/td>\u003ctd>Kernel isolation features\u003c/td>\u003ctd>Hypervisor (software that runs VMs)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Startup\u003c/td>\u003ctd>Starts a process\u003c/td>\u003ctd>Boots an operating system\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Footprint\u003c/td>\u003ctd>Application and its libraries\u003c/td>\u003ctd>Full operating system\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Sharing a kernel has practical effects. A Linux container needs a Linux kernel, so Docker Desktop on macOS and Windows runs one inside a lightweight virtual machine. A kernel vulnerability can affect every container on the host, so the isolation is weaker than a VM's. CPU architecture also still matters: an image built only for ARM fails on an x86 host with \u003ccode>exec format error\u003c/code> unless emulation is available.\u003c/p>\u003cp>A container lives only as long as its main process. When that process exits, the container stops, even if other processes were running inside it. If a script starts a background daemon and then finishes, the container exits immediately.\u003c/p>\u003cp>Containers are disposable, and their writable filesystem is deleted along with them. A common early mistake is writing uploads or a database file to the container's local disk, then finding the data gone after the next deploy replaced it. Data that must survive belongs in a mounted volume or an external service. Treating containers as replaceable is what makes \u003ca href=\"#Immutable%20infrastructure\" data-term=\"Immutable infrastructure\">immutable infrastructure\u003c/a> and \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> scheduling workable.\u003c/p>","avoid":"","usage":["All the uploaded avatars disappeared after this morning's deploy.","They were saved inside the container, so they went away when it was replaced. Put them in object storage or a mounted volume."],"out":[11,15,16,42,18]},{"name":"Container image","section":1,"description":"A read-only package of filesystem layers and startup metadata from which containers are created.","body":"\u003cp>A \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> image is a read-only package containing everything needed to start one: a filesystem made of \u003ca href=\"#Image%20layer\" data-term=\"Image layer\">image layers\u003c/a>, plus metadata such as the default command, environment variables, working directory, and user. An image is to a container roughly what a program file is to a running process. One image can start many identical containers.\u003c/p>\u003cp>Images are usually built from a \u003ca href=\"#Dockerfile\" data-term=\"Dockerfile\">Dockerfile\u003c/a> and follow the OCI (Open Container Initiative) format, so an image built with one tool can run on other compatible runtimes. They are stored in a \u003ca href=\"#Container%20registry\" data-term=\"Container registry\">container registry\u003c/a> and are a common form of \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a>.\u003c/p>\u003cp>An image can be referred to in two ways:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Reference\u003c/th>\u003cth>Example\u003c/th>\u003cth>Can it change?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tag\u003c/td>\u003ctd>\u003ccode>api:1.4.2\u003c/code>, \u003ccode>api:latest\u003c/code>\u003c/td>\u003ctd>Yes, a tag can be moved to a new image\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Digest\u003c/td>\u003ctd>\u003ccode>api@sha256:9f86d0...\u003c/code>\u003c/td>\u003ctd>No, it is a hash of the content\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The difference causes a recognisable failure. Two servers both run \u003ccode>api:latest\u003c/code>, but they behave differently because each pulled the tag at a different time and got a different image. The name \u003ccode>latest\u003c/code> has no special meaning. It is only the default tag used when none is specified, and it does not guarantee the newest build. In production, use a unique version tag per build, or a digest when you need an exact guarantee, as described in \u003ca href=\"#Dependency%20pinning\" data-term=\"Dependency pinning\">dependency pinning\u003c/a>.\u003c/p>\u003cp>One image name can cover several CPU architectures through a multi-platform index, a list pointing to one image per platform. If no entry matches the machine, the pull fails with a &quot;no matching manifest&quot; error.\u003c/p>\u003cp>Images accumulate known vulnerabilities over time as new flaws are disclosed. Rebuild them regularly on an updated base and use \u003ca href=\"#Image%20scanning\" data-term=\"Image scanning\">image scanning\u003c/a> to find what needs attention.\u003c/p>","avoid":"","usage":["Two nodes are running the same image but only one has the bug.","Same tag, or same digest? If we deployed \u003ccode>latest\u003c/code>, they may have pulled different builds. Compare the digests."],"out":[10,13,12,17,6,54,56]},{"name":"Dockerfile","section":1,"description":"A text file of ordered instructions that a builder executes to produce a container image.","body":"\u003cp>A Dockerfile is a text file of ordered instructions that a builder executes to produce a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>. Each instruction starts from the result of the previous one, and those that change files produce a new \u003ca href=\"#Image%20layer\" data-term=\"Image layer\">image layer\u003c/a>.\u003c/p>\u003cpre>\u003ccode>FROM node:22-slim\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci --omit=dev\nCOPY . .\nUSER node\nCMD [&quot;node&quot;, &quot;server.js&quot;]\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Instruction\u003c/th>\u003cth>Runs at\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>FROM\u003c/code>\u003c/td>\u003ctd>Build\u003c/td>\u003ctd>Selects the base image\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>COPY\u003c/code>\u003c/td>\u003ctd>Build\u003c/td>\u003ctd>Adds files from the build context\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RUN\u003c/code>\u003c/td>\u003ctd>Build\u003c/td>\u003ctd>Executes a command and saves the result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ENV\u003c/code>\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Sets environment variables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>USER\u003c/code>\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Sets the user for later steps and at runtime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ENTRYPOINT\u003c/code>\u003c/td>\u003ctd>Start\u003c/td>\u003ctd>Sets the executable for the \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CMD\u003c/code>\u003c/td>\u003ctd>Start\u003c/td>\u003ctd>Sets default arguments or a default command\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Instruction order controls build speed. Builders reuse cached layers until they reach a step whose input changed, then rerun everything after it. If \u003ccode>COPY . .\u003c/code> comes before the dependency install, editing one source file reinstalls every package, and a build that should take seconds takes minutes. Copying the lockfile first, as above, keeps the install step cached until dependencies change.\u003c/p>\u003cp>Three other mistakes are common. Without a \u003ccode>.dockerignore\u003c/code> file, the build context can include \u003ccode>node_modules\u003c/code>, \u003ccode>.git\u003c/code>, and local \u003ccode>.env\u003c/code> files, and \u003ccode>COPY . .\u003c/code> puts them in the image. Passing a password through \u003ccode>ARG\u003c/code> or \u003ccode>ENV\u003c/code> can leave it readable in the image's metadata or history, so use the builder's secret mount feature. Containers run as root unless the image or runtime sets another user.\u003c/p>\u003cp>The form of \u003ccode>CMD\u003c/code> affects shutdown. \u003ccode>CMD node server.js\u003c/code> runs under a shell, which may not forward the stop signal to Node, so the container hangs until it is force-killed. The JSON form runs the process directly. To keep build tools out of the result, use a \u003ca href=\"#Multi-stage%20build\" data-term=\"Multi-stage build\">multi-stage build\u003c/a>.\u003c/p>","avoid":"","usage":["Every \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a> build reinstalls all our dependencies, even for a typo fix.","Your Dockerfile copies the whole repo before \u003ccode>npm ci\u003c/code>. Copy the lockfile first so the install layer stays cached."],"out":[11,13,10,14,2]},{"name":"Image layer","section":1,"description":"A read-only set of filesystem changes. Stacked layers form a container image and are cached and shared between images.","body":"\u003cp>An image layer is a read-only set of filesystem changes: files added, modified, or deleted relative to the layer below it. A \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a> is an ordered stack of these layers, and a union filesystem merges them into the single directory tree that a \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> sees. In a \u003ca href=\"#Dockerfile\" data-term=\"Dockerfile\">Dockerfile\u003c/a>, instructions such as \u003ccode>RUN\u003c/code>, \u003ccode>COPY\u003c/code>, and \u003ccode>ADD\u003c/code> each create a layer.\u003c/p>\u003cp>Layers are identified by a hash of their content, which gives three benefits:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Benefit\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Build caching\u003c/td>\u003ctd>Unchanged steps reuse an existing layer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Faster pushes\u003c/td>\u003ctd>A \u003ca href=\"#Container%20registry\" data-term=\"Container registry\">container registry\u003c/a> receives only the layers it lacks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shared storage\u003c/td>\u003ctd>Images with the same base keep one copy on disk\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When a container starts, the runtime adds a thin writable layer on top. Changing an existing file copies it into that layer first (copy-on-write), and the layer is deleted with the container.\u003c/p>\u003cp>Because lower layers are read-only, deleting a file in a later layer does not remove it. The later layer records a &quot;whiteout&quot; marker that hides the file, while the bytes remain in the earlier layer. For example, a Dockerfile downloads a 500 MB archive in one \u003ccode>RUN\u003c/code>, deletes it in the next, and the image stays 500 MB larger.\u003c/p>\u003cp>The same mechanism creates a security problem. If a credential was copied in and removed later, anyone who can pull the image can extract the earlier layer and read it. Treat any secret that ever entered a layer as leaked, and rotate it.\u003c/p>\u003cp>To keep layers small, create and delete temporary files within the same \u003ccode>RUN\u003c/code> command, or use a \u003ca href=\"#Multi-stage%20build\" data-term=\"Multi-stage build\">multi-stage build\u003c/a>. \u003ccode>docker history\u003c/code> shows what each layer added.\u003c/p>","avoid":"","usage":["I added \u003ccode>rm -rf /tmp/build\u003c/code> at the end, but the image didn't shrink.","That's a new image layer hiding the files. The bytes are still in the earlier one. Do the cleanup in the same \u003ccode>RUN\u003c/code> step."],"out":[11,10,12,17,14]},{"name":"Multi-stage build","section":1,"description":"A Dockerfile with several FROM stages, where only selected outputs are copied into a smaller final image.","body":"\u003cp>A multi-stage build is a \u003ca href=\"#Dockerfile\" data-term=\"Dockerfile\">Dockerfile\u003c/a> with more than one \u003ccode>FROM\u003c/code> instruction, where each \u003ccode>FROM\u003c/code> starts a separate stage and later stages copy only the files they need from earlier ones. Compilers, package managers, and source code stay in the build stage. The final \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a> contains the application and its runtime needs.\u003c/p>\u003cpre>\u003ccode>FROM golang:1.23 AS build\nWORKDIR /src\nCOPY . .\nRUN CGO_ENABLED=0 go build -o /app ./cmd/api\n\nFROM gcr.io/distroless/static-debian12\nCOPY --from=build /app /app\nENTRYPOINT [&quot;/app&quot;]\u003c/code>\u003c/pre>\u003cp>Without this technique, a small service can ship as an image of more than a gigabyte because it includes the entire toolchain used to compile it. Large images are slower to push and pull, which slows deployments and the start of new replicas during scaling. Every extra package also adds findings to \u003ca href=\"#Image%20scanning\" data-term=\"Image scanning\">image scanning\u003c/a> and gives an attacker more tools to use after a break-in.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Final base\u003c/th>\u003cth>Contains\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Full distro\u003c/td>\u003ctd>Package manager, shell, utilities\u003c/td>\u003ctd>Large, easy to debug\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slim\u003c/td>\u003ctd>Reduced distribution\u003c/td>\u003ctd>Smaller, still has a shell\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Distroless\u003c/td>\u003ctd>Runtime libraries, no shell\u003c/td>\u003ctd>Small, harder to debug\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>scratch\u003c/code>\u003c/td>\u003ctd>Nothing\u003c/td>\u003ctd>Needs a fully static binary\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Smaller bases can fail in less obvious ways. A dynamically linked binary copied into \u003ccode>scratch\u003c/code> fails with \u003ccode>no such file or directory\u003c/code>, even though the file is there, because the missing item is the system's dynamic linker. Binaries built against glibc can fail the same way on Alpine, which uses musl. Apps that make HTTPS calls may also need CA certificates copied in, or every TLS connection fails. Build statically, or choose a base that matches the build stage.\u003c/p>\u003cp>A build can stop at a named stage using \u003ccode>--target\u003c/code>, which is useful for running tests in the build environment. Layers from earlier stages are not part of the final image, although they can remain in the builder's cache.\u003c/p>","avoid":"","usage":["Why is a 20 MB Go service shipping as a 1.2 GB image?","It still has the whole Go toolchain in it. Switch to a multi-stage build and copy only the binary into a distroless base."],"out":[12,11,56]},{"name":"Linux namespace","section":1,"description":"A Linux kernel feature that gives a process its own isolated view of a resource such as process IDs, network, or mounts.","body":"\u003cp>A Linux namespace is a kernel feature that gives a group of processes their own isolated view of one system resource. A \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> is largely an ordinary process placed in a set of these namespaces, with \u003ca href=\"#cgroup\" data-term=\"cgroup\">cgroups\u003c/a> limiting what it can consume.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Namespace\u003c/th>\u003cth>Isolates\u003c/th>\u003cth>Effect inside a container\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PID\u003c/td>\u003ctd>Process IDs\u003c/td>\u003ctd>Main process appears as PID 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Interfaces, IPs, ports, routes\u003c/td>\u003ctd>Has its own \u003ccode>localhost\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mount\u003c/td>\u003ctd>Filesystem mount points\u003c/td>\u003ctd>Sees the \u003ca href=\"#Container%20image\" data-term=\"Container image\">image\u003c/a> as its root filesystem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UTS\u003c/td>\u003ctd>Hostname\u003c/td>\u003ctd>Has its own hostname\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IPC\u003c/td>\u003ctd>Shared memory, message queues\u003c/td>\u003ctd>Cannot reach other containers' queues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User\u003c/td>\u003ctd>User and group IDs\u003c/td>\u003ctd>Root inside can map to non-root outside\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cgroup\u003c/td>\u003ctd>View of the cgroup hierarchy\u003c/td>\u003ctd>Sees its own cgroup as the root\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time\u003c/td>\u003ctd>Boot and monotonic clocks\u003c/td>\u003ctd>Can have offset clocks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The network namespace explains a frequent beginner failure. An app in one container connects to a database at \u003ccode>localhost:5432\u003c/code> and gets &quot;connection refused&quot;, although the database is running. \u003ccode>localhost\u003c/code> refers to the container's own namespace, where nothing listens on that port. Connect using the other container's service name instead. Inside a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a>, the reverse applies: containers share one network namespace, so they do reach each other on \u003ccode>localhost\u003c/code>.\u003c/p>\u003cp>The PID namespace explains slow shutdowns. The kernel treats PID 1 specially: a signal with no installed handler is ignored instead of taking its default action. An app that never registers a \u003ccode>SIGTERM\u003c/code> handler therefore keeps running when asked to stop, and the runtime force-kills it after a timeout. Add a handler, or run a small init process such as \u003ccode>tini\u003c/code> as PID 1.\u003c/p>\u003cp>Namespaces hide resources but do not make a process secure by themselves. All containers on a host still share one kernel.\u003c/p>","avoid":"","usage":["The API can't reach Redis on localhost, but Redis is definitely up.","Different containers, different network namespaces. \u003ccode>localhost\u003c/code> is the API container itself. Use the \u003ccode>redis\u003c/code> hostname."],"out":[10,16,11,18,20]},{"name":"cgroup","section":1,"description":"A Linux kernel feature that limits and measures the CPU, memory, I/O, and process count used by a group of processes.","body":"\u003cp>A cgroup (control group) is a Linux kernel feature that limits and measures the resources used by a group of processes. Where a \u003ca href=\"#Linux%20namespace\" data-term=\"Linux namespace\">Linux namespace\u003c/a> controls what a process can see, a cgroup controls how much it can use. \u003ca href=\"#Container\" data-term=\"Container\">Container\u003c/a> runtimes create a cgroup for each one, and the \u003ca href=\"#Resource%20requests%20and%20limits\" data-term=\"Resource requests and limits\">resource requests and limits\u003c/a> set in \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> are enforced through them. Most current Linux distributions default to cgroup v2.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Resource\u003c/th>\u003cth>Limit example\u003c/th>\u003cth>What happens at the limit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>0.5 CPU\u003c/td>\u003ctd>Processes are paused until the next period\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory\u003c/td>\u003ctd>512 MiB\u003c/td>\u003ctd>Reclaim is attempted, then the OOM killer runs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PIDs\u003c/td>\u003ctd>200 processes\u003c/td>\u003ctd>Creating another process or thread fails\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Block I/O\u003c/td>\u003ctd>Bytes or operations per second\u003c/td>\u003ctd>Reads and writes are slowed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The two limits behave very differently. Exceeding a memory limit gets a process killed, which appears in Kubernetes as \u003ca href=\"#OOMKilled\" data-term=\"OOMKilled\">OOMKilled\u003c/a>. Exceeding a CPU limit only slows the process down, which makes it harder to notice.\u003c/p>\u003cp>CPU limits work as a quota per scheduling period, by default 100 ms. A limit of 0.5 CPU allows 50 ms of CPU time per period, counted across all threads. Four busy threads spend that in about 12.5 ms, then all of them are paused for the remaining 87.5 ms. The result is a service with latency spikes while its average CPU usage looks moderate. The metric to check is CPU throttling, reported in the cgroup's \u003ccode>cpu.stat\u003c/code> file.\u003c/p>\u003cp>Software inside the container may not know about these limits. Tools such as \u003ccode>free\u003c/code> read \u003ccode>/proc/meminfo\u003c/code>, which reports the host's memory. An application that sizes its heap or thread pool from host numbers can overrun its limit. Many language runtimes now read cgroup limits, but check yours.\u003c/p>","avoid":"","usage":["P99 latency jumps every few seconds, but the CPU graph sits at 40%.","Check throttling. The cgroup quota could be used up early in each period, and the threads then sit paused until the next one."],"out":[15,10,31,18,32]},{"name":"Container registry","section":1,"description":"A server that stores container images and serves them to machines that need to run them.","body":"\u003cp>A \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> registry is a server that stores \u003ca href=\"#Container%20image\" data-term=\"Container image\">container images\u003c/a> and serves them to the machines that run them. A \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> pushes a new image after a build, and a host or \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> node pulls it before starting a container. Docker Hub, GitHub Container Registry, Amazon ECR, and Harbor are examples. A general \u003ca href=\"#Artifact%20registry\" data-term=\"Artifact registry\">artifact registry\u003c/a> can often store images alongside other package types.\u003c/p>\u003cp>An image reference names its location in the registry:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Example\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Registry\u003c/td>\u003ctd>\u003ccode>ghcr.io\u003c/code>\u003c/td>\u003ctd>The server. Docker Hub if omitted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repository\u003c/td>\u003ctd>\u003ccode>acme/api\u003c/code>\u003c/td>\u003ctd>A collection of related images\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tag\u003c/td>\u003ctd>\u003ccode>1.4.2\u003c/code>\u003c/td>\u003ctd>A movable, human-readable label\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Digest\u003c/td>\u003ctd>\u003ccode>sha256:9f86...\u003c/code>\u003c/td>\u003ctd>The immutable hash of the image manifest\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Together these form \u003ccode>ghcr.io/acme/api:1.4.2\u003c/code>. Pushes and pulls transfer only the \u003ca href=\"#Image%20layer\" data-term=\"Image layer\">image layers\u003c/a> the other side lacks, so images that share a base move quickly.\u003c/p>\u003cp>Registry problems usually appear in Kubernetes as \u003ccode>ErrImagePull\u003c/code>, followed by \u003ccode>ImagePullBackOff\u003c/code> while the kubelet (the agent on each node) waits between retries. The usual causes are a mistyped name, a tag that was never pushed, missing credentials for a private repository, or a rate limit. Docker Hub limits pulls, so a cluster that scales up can hit the limit and fail to start workloads that have nothing wrong with them. A pull-through cache, which is a local registry that fetches and stores upstream images on first use, avoids that dependency.\u003c/p>\u003cp>Two settings are worth enabling. Tag immutability, offered by many registries, prevents an existing tag from being pushed over, so \u003ccode>1.4.2\u003c/code> always means the same image. A retention policy removes old images to control storage costs, but it should keep anything currently deployed and enough history for a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>. Registries can also run \u003ca href=\"#Image%20scanning\" data-term=\"Image scanning\">image scanning\u003c/a> when an image is pushed.\u003c/p>","avoid":"","usage":["The new \u003ca href=\"#Pod\" data-term=\"Pod\">pods\u003c/a> are all stuck in ImagePullBackOff.","Check that the tag exists in the container registry. If it does, the node's pull secret has probably expired."],"out":[10,11,5,18,7,13,51,56,20]},{"name":"Kubernetes","section":2,"description":"A system that runs containers across a cluster of machines and continually works to match the state you declared.","body":"\u003cp>Kubernetes (often written K8s) is an open-source system that runs \u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a> across a group of machines, called a cluster. You describe the state you want, such as &quot;three copies of this \u003ca href=\"#Container%20image\" data-term=\"Container image\">image\u003c/a>, reachable on this port&quot;, and Kubernetes starts, places, connects, and replaces workloads to keep that state true.\u003c/p>\u003cp>A cluster has two parts. The \u003ca href=\"#Control%20plane\" data-term=\"Control plane\">control plane\u003c/a> stores the desired state and makes decisions. Worker machines, called nodes, run the workloads inside \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a>.\u003c/p>\u003cp>Most work happens through a small set of object types:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Object\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Run a stateless app\u003c/td>\u003ctd>\u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Run an app with stable identity\u003c/td>\u003ctd>\u003ca href=\"#StatefulSet\" data-term=\"StatefulSet\">StatefulSet\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Run one copy per node\u003c/td>\u003ctd>\u003ca href=\"#DaemonSet\" data-term=\"DaemonSet\">DaemonSet\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Give Pods a stable address\u003c/td>\u003ctd>\u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Route outside HTTP traffic\u003c/td>\u003ctd>\u003ca href=\"#Ingress\" data-term=\"Ingress\">Ingress\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Supply settings\u003c/td>\u003ctd>\u003ca href=\"#ConfigMap\" data-term=\"ConfigMap\">ConfigMap\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Supply credentials\u003c/td>\u003ctd>\u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Secret\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The behaviour that defines Kubernetes is reconciliation. Controllers, which are background loops, compare the declared state with the actual state and act on any difference. For example, you delete a misbehaving Pod and a new one appears within seconds. You removed the instance but left the instruction that says it should exist. To stop it, scale down or delete the object that owns it.\u003c/p>\u003cp>Reconciliation also means that changes are asynchronous. A successful \u003ccode>kubectl apply\u003c/code> only records your intent in the API. It does not mean the app is running, so a deploy can &quot;succeed&quot; while every new Pod fails to start. Check the rollout status and Pod events afterwards.\u003c/p>\u003cp>Kubernetes adds real operational weight: networking, upgrades, access control, and many concepts to learn. A managed offering such as Amazon EKS, Google GKE, or Azure AKS runs the control plane for you, but your team still owns the workloads. A single small service often does not need it.\u003c/p>","avoid":"","usage":["I keep deleting this broken pod and it keeps coming back.","That's Kubernetes doing its job. The Deployment still asks for three replicas, so scale that down or fix the image."],"out":[10,11,19,20,21,27,28,23,24,25,26]},{"name":"Control plane","section":2,"description":"The Kubernetes components that store cluster state, schedule workloads, and run the controllers that keep it as declared.","body":"\u003cp>The control plane is the set of \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> components that stores cluster state and decides what should run where. Worker nodes run the applications. The control plane tells them what to run and tracks the result.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>API server\u003c/td>\u003ctd>Front door for all reads and writes, with authentication and validation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>etcd\u003c/td>\u003ctd>Consistent key-value store that holds all cluster state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scheduler\u003c/td>\u003ctd>Picks a node for each unscheduled \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controller manager\u003c/td>\u003ctd>Runs the loops that reconcile actual state with desired state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud controller manager\u003c/td>\u003ctd>Talks to the cloud provider for load balancers, routes, and nodes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each worker node runs a kubelet, an agent that watches the API server and starts the Pod's \u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a> through a container runtime. Components communicate through the API server, and only the API server talks to etcd.\u003c/p>\u003cp>A typical sequence for creating a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a>: the API server validates and stores it in etcd, a controller creates a \u003ca href=\"#ReplicaSet\" data-term=\"ReplicaSet\">ReplicaSet\u003c/a> and Pods, the scheduler assigns each Pod to a node, and that node's kubelet starts it.\u003c/p>\u003cp>Control plane failure does not immediately stop applications. Containers on healthy nodes keep running and can keep serving traffic, while \u003ccode>kubectl\u003c/code> commands fail or time out. The damage is that nothing can change: no new deployments, no scaling, and no rescheduling of Pods from a node that dies.\u003c/p>\u003cp>etcd needs a majority of its members to accept writes, so production clusters run an odd number, usually three or five. Three members tolerate one failure, and five tolerate two. Losing etcd without a backup means losing the cluster's definition, so self-managed clusters need tested backups. Managed services such as EKS, GKE, and AKS operate the control plane for you.\u003c/p>","avoid":"","usage":["kubectl is timing out. Is the site down?","No, the app's still serving. The control plane is having trouble, so running pods are fine, but hold off on deploys until it recovers."],"out":[18,20,10,21,22]},{"name":"Pod","section":2,"description":"The smallest deployable unit in Kubernetes, made of one or more containers that share a network identity and can share storage.","body":"\u003cp>A Pod is the smallest unit \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> can deploy: one or more \u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a> scheduled together on the same node. Containers in a Pod share a network namespace, so they have one IP address and reach each other on \u003ccode>localhost\u003c/code>, and they can mount the same volumes. Most Pods hold one application container, sometimes with a sidecar that ships logs or an init container that runs setup before the app starts.\u003c/p>\u003cp>Pods are disposable. A Pod is bound to one node and is not moved. If the node fails, or the Pod is deleted, a controller such as a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> creates a replacement with a new name and a new IP address. Code that stores a Pod IP in configuration breaks the next time that happens, so clients should connect through a \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a>.\u003c/p>\u003cp>A restart is different from a replacement. When a container crashes, the kubelet (the agent on each node) restarts that container inside the same Pod, which keeps its name and IP. Files in the container's writable layer are lost, while an \u003ccode>emptyDir\u003c/code> volume survives until the Pod is removed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pending\u003c/td>\u003ctd>Accepted, but not all containers have started yet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Running\u003c/td>\u003ctd>Bound to a node, with at least one container running or starting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Succeeded\u003c/td>\u003ctd>All containers exited successfully and will not restart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failed\u003c/td>\u003ctd>All containers stopped, and at least one failed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown\u003c/td>\u003ctd>The Pod's state cannot be obtained, often a node problem\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A Pod stuck in Pending usually has no node that fits its \u003ca href=\"#Resource%20requests%20and%20limits\" data-term=\"Resource requests and limits\">resource requests\u003c/a>, or it is waiting on a volume. The Events section of \u003ccode>kubectl describe pod\u003c/code> gives the reason. Statuses such as \u003ca href=\"#CrashLoopBackOff\" data-term=\"CrashLoopBackOff\">CrashLoopBackOff\u003c/a> appear in \u003ccode>kubectl get pods\u003c/code> but are not phases.\u003c/p>","avoid":"","usage":["The payment service had the worker's IP hardcoded, and it broke after the node drain.","Pod IPs change whenever a pod gets replaced. Point it at the Service name instead."],"out":[18,10,21,23,31,33]},{"name":"Kubernetes Deployment","section":2,"description":"A Kubernetes object that runs a set of identical Pods and manages rolling updates and rollbacks through ReplicaSets.","body":"\u003cp>A \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> Deployment is an object that declares how a stateless application should run: which \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>, how many replicas, and how to update them. It does not manage \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> directly. It creates a \u003ca href=\"#ReplicaSet\" data-term=\"ReplicaSet\">ReplicaSet\u003c/a> for each version of the Pod template, and shifts replicas between them during an update.\u003c/p>\u003cpre>\u003ccode>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 3\n  selector:\n    matchLabels: { app: api }\n  template:\n    metadata:\n      labels: { app: api }\n    spec:\n      containers:\n        - name: api\n          image: ghcr.io/acme/api:1.4.2\u003c/code>\u003c/pre>\u003cp>Changing anything in \u003ccode>template\u003c/code>, such as the image tag, triggers a \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployment\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>A new ReplicaSet is created for the new template\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>It scales up, within the \u003ccode>maxSurge\u003c/code> allowance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Old Pods are removed as new ones pass their \u003ca href=\"#Readiness%20probe\" data-term=\"Readiness probe\">readiness probe\u003c/a>, within \u003ccode>maxUnavailable\u003c/code>\u003
