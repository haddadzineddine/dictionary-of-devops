c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>The old ReplicaSet stays at zero replicas, available for \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Both \u003ccode>maxSurge\u003c/code> and \u003ccode>maxUnavailable\u003c/code> default to 25%. Changing only \u003ccode>replicas\u003c/code> scales the current ReplicaSet and does not start a rollout. Editing a \u003ca href=\"#ConfigMap\" data-term=\"ConfigMap\">ConfigMap\u003c/a> does not start one either, which is why a config change can appear to do nothing.\u003c/p>\u003cp>A failed rollout often looks like a hang. If new Pods never become ready, the update stops partway and old Pods keep serving, which protects users. After \u003ccode>progressDeadlineSeconds\u003c/code>, 600 by default, the Deployment reports \u003ccode>ProgressDeadlineExceeded\u003c/code>. It does not roll itself back. Someone must fix the image or run \u003ccode>kubectl rollout undo\u003c/code>. \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">Pipelines\u003c/a> should run \u003ccode>kubectl rollout status\u003c/code> so that a stuck rollout fails the job, because \u003ccode>kubectl apply\u003c/code> returns success as soon as the change is accepted.\u003c/p>\u003cp>Use a \u003ca href=\"#StatefulSet\" data-term=\"StatefulSet\">StatefulSet\u003c/a> instead when replicas need stable identities or individual storage.\u003c/p>","avoid":"","usage":["\u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a> says the deploy passed, but we're still serving the old version.","Apply only submits the change. The Kubernetes Deployment is stuck because the new pods are failing readiness. Check \u003ccode>kubectl rollout status\u003c/code>."],"out":[18,11,20,22,47,30,51,25,5,27,2]},{"name":"ReplicaSet","section":2,"description":"A Kubernetes controller that keeps a set number of matching Pods running, usually created and managed by a Deployment.","body":"\u003cp>A ReplicaSet is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> object that keeps a specified number of matching \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> running. If there are too few it creates more from its Pod template, and if there are too many it deletes the excess. It finds its Pods using a label selector, which is a query over key-value tags attached to objects.\u003c/p>\u003cp>You rarely create one by hand. A \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> creates and owns ReplicaSets, one per version of the Pod template. That is why Pod names have two generated parts: in \u003ccode>api-7d9f6c5b4-x2kqp\u003c/code>, \u003ccode>7d9f6c5b4\u003c/code> identifies the ReplicaSet and \u003ccode>x2kqp\u003c/code> identifies the Pod.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Object\u003c/th>\u003cth>Responsible for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Deployment\u003c/td>\u003ctd>Versions, rollout strategy, and history\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ReplicaSet\u003c/td>\u003ctd>The replica count for one version\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pod\u003c/td>\u003ctd>Running the \u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>During a \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployment\u003c/a>, the Deployment scales a new ReplicaSet up and the old one down. Old ReplicaSets stay at zero replicas so that a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> can scale one back up. \u003ccode>revisionHistoryLimit\u003c/code>, 10 by default, sets how many are kept. This is why \u003ccode>kubectl get rs\u003c/code> shows a list of entries with zero Pods, and they are normally safe to leave.\u003c/p>\u003cp>Three behaviours cause confusion. Manually scaling a ReplicaSet owned by a Deployment does not last, because the Deployment sets it back to the declared count. Editing the template of a standalone ReplicaSet does not update running Pods, because the template is only used when creating new ones, so the old \u003ca href=\"#Container%20image\" data-term=\"Container image\">image\u003c/a> keeps running until those Pods are replaced. A ReplicaSet can also adopt existing Pods that have no owner and match its selector, so overlapping labels can cause it to take over or delete Pods you created separately.\u003c/p>\u003cp>To change the replica count or image, edit the Deployment.\u003c/p>","avoid":"","usage":["I scaled the ReplicaSet to five, and it went straight back to three.","The Deployment owns it and still says three. Change the replica count on the Deployment."],"out":[18,20,21,10,47,51,11]},{"name":"Kubernetes Service","section":2,"description":"A Kubernetes object giving a changing set of Pods one stable virtual IP and DNS name, and spreading connections across them.","body":"\u003cp>A \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> Service is an object that gives a changing set of \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> one stable address. Pods are replaced often and get new IPs each time, so clients connect to the Service's virtual IP or DNS name instead. A Service named \u003ccode>api\u003c/code> in namespace \u003ccode>shop\u003c/code> resolves at \u003ccode>api.shop.svc.cluster.local\u003c/code>, or \u003ccode>api\u003c/code> from within the same namespace.\u003c/p>\u003cp>A label selector chooses the Pods. Matching Pods are recorded in EndpointSlice objects, and kube-proxy, a component on each node, usually routes new connections to those passing their \u003ca href=\"#Readiness%20probe\" data-term=\"Readiness probe\">readiness probe\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Reachable from\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ClusterIP\u003c/code>\u003c/td>\u003ctd>Inside the cluster (default)\u003c/td>\u003ctd>Service-to-service traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>NodePort\u003c/code>\u003c/td>\u003ctd>A port on every node\u003c/td>\u003ctd>Simple external access, testing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>LoadBalancer\u003c/code>\u003c/td>\u003ctd>A cloud load balancer\u003c/td>\u003ctd>Exposing one service publicly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ExternalName\u003c/code>\u003c/td>\u003ctd>DNS alias to an outside host\u003c/td>\u003ctd>Pointing at an external system\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A &quot;headless&quot; Service, with \u003ccode>clusterIP: None\u003c/code>, has no virtual IP. DNS returns the individual Pod addresses, which a \u003ca href=\"#StatefulSet\" data-term=\"StatefulSet\">StatefulSet\u003c/a> uses to give each replica a stable name.\u003c/p>\u003cp>A frequent failure is a Service with no ready endpoints. Connections fail even though Pods are running, usually because the selector does not match the Pod labels or no Pod is ready. Check with \u003ccode>kubectl get endpointslices -l kubernetes.io/service-name=api\u003c/code>. A wrong \u003ccode>targetPort\u003c/code> gives a similar symptom with endpoints present.\u003c/p>\u003cp>Balancing happens per connection, not per request. A client using one long-lived HTTP/2 or gRPC connection sends all its requests to one Pod, so one replica can be overloaded while others sit idle. Client-side balancing or a \u003ca href=\"#Service%20mesh\" data-term=\"Service mesh\">service mesh\u003c/a> can spread those requests. For HTTP routing from outside the cluster, use \u003ca href=\"#Ingress\" data-term=\"Ingress\">Ingress\u003c/a>.\u003c/p>","avoid":"","usage":["The pods are healthy but the Service just times out.","Look at its endpoints. If the list is empty, the selector probably says \u003ccode>app: api\u003c/code> while the pods are labelled \u003ccode>app: api-server\u003c/code>."],"out":[18,20,30,27,37,24]},{"name":"Ingress","section":2,"description":"A Kubernetes object with HTTP routing rules that send outside traffic to Services, carried out by an ingress controller.","body":"\u003cp>An Ingress is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> object that defines how HTTP and HTTPS traffic from outside the cluster reaches internal \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Services\u003c/a>, based on hostname and URL path. One public entry point can route \u003ccode>app.example.com/api\u003c/code> to one Service and \u003ccode>app.example.com/\u003c/code> to another, and can terminate TLS (decrypt HTTPS) using a certificate stored in a \u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Kubernetes Secret\u003c/a>.\u003c/p>\u003cpre>\u003ccode>apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: web\nspec:\n  ingressClassName: traefik\n  rules:\n    - host: app.example.com\n      http:\n        paths:\n          - path: /api\n            pathType: Prefix\n            backend:\n              service:\n                name: api\n                port: { number: 80 }\u003c/code>\u003c/pre>\u003cp>An Ingress object is only a set of rules, and Kubernetes itself does not act on them. An ingress controller, which is a reverse proxy running in the cluster such as Traefik or HAProxy, watches these objects and configures itself. This explains a common first experience: the Ingress is created without errors, its address stays blank, and nothing responds, because no controller is installed or \u003ccode>ingressClassName\u003c/code> does not match one.\u003c/p>\u003cp>Errors at this layer usually point to a specific cause:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Likely cause\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>404\u003c/td>\u003ctd>No rule matches the host or path\u003c/td>\u003c/tr>\u003ctr>\u003ctd>502\u003c/td>\u003ctd>Controller reached a backend that refused or dropped it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>503\u003c/td>\u003ctd>The Service has no ready \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>504\u003c/td>\u003ctd>Backend too slow for the proxy's timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wrong certificate\u003c/td>\u003ctd>TLS host or Secret mismatch, or Secret in another namespace\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Exact responses vary by controller. Behaviour beyond basic routing, such as rewrites, rate limits, and timeouts, is usually set through controller-specific annotations, so an Ingress written for one controller may not work the same on another.\u003c/p>\u003cp>The Ingress API is frozen, and new features go to its successor, the Gateway API, which separates infrastructure and routing concerns into distinct objects. Ingress remains supported and widely used.\u003c/p>","avoid":"","usage":["I created the Ingress, but the address column is empty and the domain doesn't resolve.","Is there a controller in this cluster? The object does nothing until something implements it, and your \u003ccode>ingressClassName\u003c/code> has to match."],"out":[18,23,26,20]},{"name":"ConfigMap","section":2,"description":"A Kubernetes object holding non-confidential settings that Pods read as environment variables or mounted files.","body":"\u003cp>A ConfigMap is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> object that stores non-confidential configuration as key-value pairs, separately from the \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>. One image can then run in staging and production with different settings, which supports promoting a single \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a>. A ConfigMap is limited to 1 MiB and must be in the same namespace as the \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> using it. Credentials belong in a \u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Kubernetes Secret\u003c/a> or external \u003ca href=\"#Secrets%20management\" data-term=\"Secrets management\">secrets management\u003c/a>.\u003c/p>\u003cpre>\u003ccode>apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: api-config\ndata:\n  LOG_LEVEL: info\n  FEATURE_URL: https://flags.internal\u003c/code>\u003c/pre>\u003cp>The way a Pod consumes a ConfigMap decides what happens when it changes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Consumed as\u003c/th>\u003cth>After the ConfigMap is edited\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Environment variable\u003c/td>\u003ctd>No change until the \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> restarts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mounted volume\u003c/td>\u003ctd>Files update after a delay, and the app must re-read them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Volume with \u003ccode>subPath\u003c/code>\u003c/td>\u003ctd>No change until the container restarts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The familiar symptom is editing a value, seeing the new value in \u003ccode>kubectl get configmap\u003c/code>, and finding that the application still behaves the old way. Editing a ConfigMap does not restart anything and does not trigger a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Kubernetes Deployment\u003c/a> rollout. Run \u003ccode>kubectl rollout restart deployment/api\u003c/code>, or include a hash of the config as an annotation in the Pod template so that a config change produces a new rollout. \u003ca href=\"#Helm\" data-term=\"Helm\">Helm\u003c/a> charts commonly do the second.\u003c/p>\u003cp>A shared, mutable ConfigMap also weakens \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>, because rolling back the Deployment does not restore old config values. Versioned names such as \u003ccode>api-config-v12\u003c/code>, referenced from the Pod template, tie configuration to the release.\u003c/p>\u003cp>A missing ConfigMap blocks startup. A missing environment reference shows \u003ccode>CreateContainerConfigError\u003c/code>, and a missing volume leaves the Pod in \u003ccode>ContainerCreating\u003c/code> with a mount error in its events.\u003c/p>","avoid":"","usage":["I changed LOG_LEVEL to debug an hour ago and still see nothing.","It's injected as an env var from the ConfigMap, so running containers keep the old value. Do a rollout restart."],"out":[18,11,6,20,26,46,10,21,35,51]},{"name":"Kubernetes Secret","section":2,"description":"A Kubernetes object for small sensitive values. Its data is base64-encoded and is not encrypted by default.","body":"\u003cp>A \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> Secret is an object for holding small pieces of sensitive data, such as passwords, API tokens, and TLS certificates, so they stay out of \u003ca href=\"#Container%20image\" data-term=\"Container image\">container images\u003c/a> and \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> specs. Pods consume Secrets as environment variables or mounted files. The size limit is 1 MiB.\u003c/p>\u003cp>Secret values are base64-encoded, and base64 is a reversible text format that provides no protection. Anyone who can read the object can decode it with one command:\u003c/p>\u003cpre>\u003ccode>echo 'cGFzc3dvcmQ=' | base64 --decode\u003c/code>\u003c/pre>\u003cp>By default the API server also stores Secrets unencrypted in etcd, the cluster's database. A frequent mistake is committing a Secret manifest to Git because the values look scrambled. Rotate any value exposed this way.\u003c/p>\u003cp>Protecting Secrets takes several separate measures:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>What it protects against\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Encryption at rest\u003c/td>\u003ctd>Someone reading etcd or its backups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RBAC (role-based access control)\u003c/td>\u003ctd>Users and workloads reading Secrets via the API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Namespace separation\u003c/td>\u003ctd>Workloads in other namespaces mounting them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>External secret store\u003c/td>\u003ctd>Long-lived values living only in the cluster\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Access rules have a gap that is easy to miss. Anyone allowed to create a Pod in a namespace can mount any Secret in that namespace and read it, even without permission to \u003ccode>get\u003c/code> Secrets directly. For stronger control, use dedicated \u003ca href=\"#Secrets%20management\" data-term=\"Secrets management\">secrets management\u003c/a> and sync or inject values at runtime.\u003c/p>\u003cp>Encoding also causes a login failure. \u003ccode>echo &quot;hunter2&quot; | base64\u003c/code> includes a trailing newline, so the application sends a password ending in \u003ccode>\\n\u003c/code> and authentication fails. Use \u003ccode>echo -n\u003c/code>, \u003ccode>kubectl create secret\u003c/code>, or the \u003ccode>stringData\u003c/code> field, which accepts plain text.\u003c/p>\u003cp>Updates behave like those of a \u003ca href=\"#ConfigMap\" data-term=\"ConfigMap\">ConfigMap\u003c/a>: environment variables keep the old value until the \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> restarts.\u003c/p>","avoid":"","usage":["It's fine to commit this Secret YAML, the password is encoded.","That's base64, so anyone can decode it. Kubernetes doesn't encrypt it for you. Rotate that password and keep it in Vault."],"out":[18,11,20,46,25,10]},{"name":"StatefulSet","section":2,"description":"A Kubernetes workload giving each Pod a stable name, stable storage, and ordered rollout, for apps like databases.","body":"\u003cp>A StatefulSet is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> workload object for applications whose replicas are not interchangeable, such as databases, message brokers, and consensus systems. Each \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> gets a stable ordinal name (\u003ccode>db-0\u003c/code>, \u003ccode>db-1\u003c/code>, \u003ccode>db-2\u003c/code>) and its own persistent volume. If \u003ccode>db-1\u003c/code> is replaced, the new Pod is also \u003ccode>db-1\u003c/code> and reattaches the same storage.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>\u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a>\u003c/th>\u003cth>StatefulSet\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pod names\u003c/td>\u003ctd>Random suffix\u003c/td>\u003ctd>Stable ordinal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Usually shared or none\u003c/td>\u003ctd>One volume claim per Pod\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Start order\u003c/td>\u003ctd>Parallel\u003c/td>\u003ctd>In order, 0 to N-1 by default\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Update order\u003c/td>\u003ctd>Surge and replace\u003c/td>\u003ctd>Reverse order, N-1 to 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Shared \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a> address\u003c/td>\u003ctd>Per-Pod DNS name via a headless Service\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A headless Service (one with no virtual IP) gives each replica an address such as \u003ccode>db-0.db.prod.svc.cluster.local\u003c/code>, so peers and clients can reach a specific member. Storage is declared in \u003ccode>volumeClaimTemplates\u003c/code>, which create one PersistentVolumeClaim (a request for durable storage) per Pod.\u003c/p>\u003cp>A StatefulSet provides identity and ordering only. Replication, leader election, and failover belong to the software itself or to a \u003ca href=\"#Kubernetes%20Operator\" data-term=\"Kubernetes Operator\">Kubernetes Operator\u003c/a>.\u003c/p>\u003cp>Three behaviours often cause problems. Scaling down or deleting a StatefulSet leaves its volumes behind by default, and a later scale-up reattaches the old data. When a node becomes unreachable, its Pod is not recreated elsewhere, because two Pods with one identity could corrupt a shared volume. It stays stuck until the node returns or someone confirms the node is gone. With default ordering, a Pod that never becomes ready blocks the rollout, and it can stay blocked after the template is fixed until the broken Pod is deleted.\u003c/p>","avoid":"","usage":["\u003ccode>db-2\u003c/code> has been Terminating for twenty minutes since that node died. Why isn't it rescheduled?","A StatefulSet won't start a second \u003ccode>db-2\u003c/code> until it knows the first is gone. Confirm the node is really dead before forcing it."],"out":[18,20,21,23,36]},{"name":"DaemonSet","section":2,"description":"A Kubernetes workload that runs one copy of a Pod on every eligible node, used for node-level agents.","body":"\u003cp>A DaemonSet is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> workload object that runs one copy of a \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> on every eligible node. When a node joins the cluster it receives the Pod automatically, and when a node is removed its copy goes with it. There is no replica count to set, because the number of nodes determines the number of Pods.\u003c/p>\u003cp>DaemonSets suit software tied to the machine instead of to an application:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Use\u003c/th>\u003cth>Example job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Log collection\u003c/td>\u003ctd>Reads \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> log files from the node's disk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metrics\u003c/td>\u003ctd>Reports node CPU, memory, and disk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Networking\u003c/td>\u003ctd>Runs the cluster network plugin or kube-proxy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Runs a node driver that mounts volumes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>Watches system calls or file changes on the host\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Such Pods often use \u003ccode>hostPath\u003c/code> volumes, which mount a directory from the node, or host networking, so a compromised agent can affect the whole node. Grant only the access it needs.\u003c/p>\u003cp>The usual complaint is an agent missing from some nodes, which leaves gaps in logs or metrics from those machines. The cause is often a taint, a marker on a node that repels Pods unless they declare a matching toleration. Dedicated GPU nodes and \u003ca href=\"#Control%20plane\" data-term=\"Control plane\">control plane\u003c/a> nodes are commonly tainted. Compare \u003ccode>DESIRED\u003c/code> with the node count in \u003ccode>kubectl get daemonset\u003c/code>, then add the required toleration. A \u003ccode>nodeSelector\u003c/code> can also limit a DaemonSet deliberately to a subset of nodes.\u003c/p>\u003cp>A DaemonSet's cost multiplies by node count, because its \u003ca href=\"#Resource%20requests%20and%20limits\" data-term=\"Resource requests and limits\">resource requests\u003c/a> are reserved on every machine.\u003c/p>\u003cp>Updates use a rolling strategy by default, replacing one node's Pod at a time (\u003ccode>maxUnavailable: 1\u003c/code>). A bad version of a networking or storage agent can degrade every node it reaches, so watch the first few and run \u003ccode>kubectl rollout undo\u003c/code> at the first failure.\u003c/p>","avoid":"","usage":["We have no logs from the GPU nodes.","Those nodes are tainted, so the logging DaemonSet never scheduled there. Add a toleration for the GPU taint."],"out":[18,20,10,19,31]},{"name":"Liveness probe","section":2,"description":"A periodic Kubernetes health check that restarts a container when it fails repeatedly.","body":"\u003cp>A liveness probe is a periodic health check, run by the kubelet (the agent on each node), that decides whether a \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> should be restarted. When the probe fails \u003ccode>failureThreshold\u003c/code> times in a row, 3 by default, the kubelet kills the container and the \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a>'s restart policy applies. The Pod stays on the same node and keeps its IP address.\u003c/p>\u003cpre>\u003ccode>livenessProbe:\n  httpGet:\n    path: /livez\n    port: 8080\n  periodSeconds: 10\n  timeoutSeconds: 2\n  failureThreshold: 3\u003c/code>\u003c/pre>\u003cp>A probe can be an HTTP request (a status from 200 to 399 passes), a TCP connection, a gRPC health check, or a command that must exit with 0.\u003c/p>\u003cp>Liveness probes exist for failures that a restart can fix, such as a deadlock where the process is still running but no longer doing work. Without one, \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> only restarts a container when its process exits.\u003c/p>\u003cp>A badly designed probe can cause an outage. A frequent mistake is having the liveness endpoint check the database. When the database slows down, every replica fails its probe and restarts together, removing capacity and adding a burst of reconnections. A restart cannot fix a dependency, so the liveness check should only cover the process itself. Dependency checks belong in a \u003ca href=\"#Readiness%20probe\" data-term=\"Readiness probe\">readiness probe\u003c/a>, which takes a Pod out of traffic without restarting it.\u003c/p>\u003cp>Timing causes the other common failure. An application that needs a minute to start gets killed before it finishes, restarts, and is killed again, which shows up as \u003ca href=\"#CrashLoopBackOff\" data-term=\"CrashLoopBackOff\">CrashLoopBackOff\u003c/a>. Add a startup probe, which holds off liveness and readiness checks until it first succeeds. The default \u003ccode>timeoutSeconds\u003c/code> is 1, so a busy but healthy process can miss probes under load and be restarted.\u003c/p>\u003cp>To confirm the cause, look for \u003ccode>Liveness probe failed\u003c/code> in the events from \u003ccode>kubectl describe pod\u003c/code>.\u003c/p>","avoid":"","usage":["Every pod restarted at once when Postgres had that slow spell.","Our liveness probe queries the database. Move that check to readiness, and have liveness confirm only that the process responds."],"out":[10,20,18,30,33]},{"name":"Readiness probe","section":2,"description":"A periodic Kubernetes check that removes a Pod from Service endpoints while it fails, without restarting it.","body":"\u003cp>A readiness probe is a periodic check, run by the kubelet (the agent on each node), that decides whether a \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> should receive traffic. While it fails, the Pod is marked not ready and removed from the endpoints of any \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a> that selects it. The \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> keeps running and is not restarted. When the probe passes again, the Pod returns to rotation.\u003c/p>\u003cp>\u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> has three probe types, which answer different questions:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Probe\u003c/th>\u003cth>Question\u003c/th>\u003cth>On failure\u003c/th>\u003cth>Runs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Startup\u003c/td>\u003ctd>Has it finished starting?\u003c/td>\u003ctd>Container restarted at threshold\u003c/td>\u003ctd>Until first success\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Liveness%20probe\" data-term=\"Liveness probe\">Liveness\u003c/a>\u003c/td>\u003ctd>Is the process working?\u003c/td>\u003ctd>Container restarted\u003c/td>\u003ctd>After startup\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Readiness\u003c/td>\u003ctd>Can it take traffic now?\u003c/td>\u003ctd>Removed from Service endpoints\u003c/td>\u003ctd>After startup, continuously\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Without a readiness probe, a Pod counts as ready once its containers start. Traffic then reaches an application that is still loading data or opening connections, and users see a burst of errors on every deploy.\u003c/p>\u003cp>Readiness also controls \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployments\u003c/a>. A \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> only continues replacing old Pods as new ones become ready, so a version that never passes stalls the rollout while the old version keeps serving. That protection disappears if the probe always returns success.\u003c/p>\u003cp>Shared dependencies need caution. If every replica's readiness depends on one cache and that cache goes down, all Pods leave the endpoints at once, and a partial degradation becomes a full outage. Consider serving reduced functionality instead.\u003c/p>\u003cp>Shutdown is a separate gap. When a Pod is deleted, endpoint removal and the \u003ccode>SIGTERM\u003c/code> signal happen at about the same time, so a few requests can still arrive after the process begins to exit. Keep serving briefly after \u003ccode>SIGTERM\u003c/code>, or add a short \u003ccode>preStop\u003c/code> delay.\u003c/p>","avoid":"","usage":["We get a spike of 503s for about thirty seconds on every deploy.","The new pods take traffic before the cache warms up. Add a readiness probe that passes only once it's loaded."],"out":[20,23,10,18,29,47,21]},{"name":"Resource requests and limits","section":2,"description":"Per-container CPU and memory settings. Requests guide Pod placement, and limits cap what a container may use at runtime.","body":"\u003cp>Resource requests and limits are per-\u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> CPU and memory settings in \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a>. A request is the amount the scheduler reserves when choosing a node. A limit is the ceiling enforced at runtime through \u003ca href=\"#cgroup\" data-term=\"cgroup\">cgroups\u003c/a>. CPU is measured in cores or millicores (\u003ccode>500m\u003c/code> is half a CPU), and memory in bytes (\u003ccode>256Mi\u003c/code>).\u003c/p>\u003cpre>\u003ccode>resources:\n  requests:\n    cpu: 250m\n    memory: 256Mi\n  limits:\n    memory: 512Mi\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Request\u003c/th>\u003cth>Limit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Used by\u003c/td>\u003ctd>Scheduler, and the kernel for CPU shares\u003c/td>\u003ctd>Kernel at runtime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exceeding CPU\u003c/td>\u003ctd>Allowed when the node has spare CPU\u003c/td>\u003ctd>Throttled (paused)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exceeding memory\u003c/td>\u003ctd>Allowed, but raises eviction risk\u003c/td>\u003ctd>Container is \u003ca href=\"#OOMKilled\" data-term=\"OOMKilled\">OOMKilled\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Scheduling uses requests, not actual usage. A \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> stays Pending with an \u003ccode>Insufficient cpu\u003c/code> or \u003ccode>Insufficient memory\u003c/code> event when no node has enough unreserved capacity, even if the machines are mostly idle. Requests set too low let the scheduler pack too many Pods on one node.\u003c/p>\u003cp>If only a limit is set, the request defaults to the same value. The settings also determine a Pod's quality of service class:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Condition\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Guaranteed\u003c/td>\u003ctd>Every container has CPU and memory requests equal to limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Burstable\u003c/td>\u003ctd>At least one request or limit, but not Guaranteed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BestEffort\u003c/td>\u003ctd>No requests or limits at all\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When a node runs short of memory, the kubelet evicts Pods, generally starting with those using more than their request. BestEffort Pods have no request, so they are exposed first.\u003c/p>\u003cp>A common starting point is to set memory requests from observed usage, with a limit at or slightly above that value. CPU limits can throttle a service while the node has idle CPU, so some teams set only a CPU request. The \u003ca href=\"#Horizontal%20Pod%20Autoscaler\" data-term=\"Horizontal Pod Autoscaler\">Horizontal Pod Autoscaler\u003c/a> calculates CPU utilisation against the request.\u003c/p>","avoid":"","usage":["The pod's stuck in Pending, but the nodes are only at 20% CPU.","Scheduling looks at requests, not usage. Those nodes are fully reserved, and this pod is asking for four cores. Lower its resource requests."],"out":[10,18,16,32,20,34]},{"name":"OOMKilled","section":2,"description":"A Kubernetes status meaning the kernel killed a container for running out of memory, usually at its memory limit.","body":"\u003cp>OOMKilled is the status \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> reports when the Linux kernel's out-of-memory (OOM) killer ends a \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a>. It usually means the container reached the memory limit in its \u003ca href=\"#Resource%20requests%20and%20limits\" data-term=\"Resource requests and limits\">resource requests and limits\u003c/a>, which is enforced by a \u003ca href=\"#cgroup\" data-term=\"cgroup\">cgroup\u003c/a>. It can also happen when the whole node runs out of memory.\u003c/p>\u003cp>The kill uses \u003ccode>SIGKILL\u003c/code>, which a process cannot catch, so the application cannot log an error or shut down cleanly. The typical symptom is a service that restarts at random with logs that stop without explanation. The evidence is in the \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> status:\u003c/p>\u003cpre>\u003ccode>Last State:  Terminated\n  Reason:    OOMKilled\n  Exit Code: 137\u003c/code>\u003c/pre>\u003cp>Exit code 137 means 128 plus signal 9 (\u003ccode>SIGKILL\u003c/code>). It does not prove an OOM kill on its own, because any \u003ccode>SIGKILL\u003c/code> produces it, including one sent when a process ignores a shutdown request. Check for the \u003ccode>OOMKilled\u003c/code> reason as well. Repeated kills usually lead to \u003ca href=\"#CrashLoopBackOff\" data-term=\"CrashLoopBackOff\">CrashLoopBackOff\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Memory graph before the kill\u003c/th>\u003cth>Likely cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Climbs steadily over hours\u003c/td>\u003ctd>Memory leak\u003c/td>\u003ctd>Take a heap profile and fix the leak\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sudden spike\u003c/td>\u003ctd>Large request, file, or batch\u003c/td>\u003ctd>Stream data or bound the work size\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flat, close to the limit\u003c/td>\u003ctd>Limit too low\u003c/td>\u003ctd>Raise it based on observed usage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Container low, node full\u003c/td>\u003ctd>Node memory pressure\u003c/td>\u003ctd>Fix requests, or add node capacity\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A heap setting such as the JVM's \u003ccode>-Xmx\u003c/code> or Node's \u003ccode>--max-old-space-size\u003c/code> covers only part of a process's memory. Thread stacks, native buffers, and non-reclaimable page cache also count toward the limit, so leave headroom.\u003c/p>\u003cp>Raising the limit is the right fix only when usage is legitimately higher. With a leak, it just delays the next kill.\u003c/p>","avoid":"","usage":["The worker dies every few hours and the logs just stop.","Check the last state. If it's OOMKilled with exit code 137, the kernel killed it, so it never had a chance to log anything."],"out":[18,10,31,16,20,33]},{"name":"CrashLoopBackOff","section":2,"description":"A Kubernetes status meaning a container keeps exiting and the kubelet is waiting longer between each restart attempt.","body":"\u003cp>CrashLoopBackOff is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> status meaning a \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> keeps exiting and the kubelet (the agent on each node) is waiting before restarting it again. It describes the restart pattern. The cause is whatever made the process exit.\u003c/p>\u003cp>The wait doubles after each failed restart: 10 seconds, 20, 40, and so on, capped at five minutes. The timer resets once a container has run for 10 minutes without a problem. This is why a \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> can look as though nothing is happening for several minutes, then briefly show Running, then return to CrashLoopBackOff.\u003c/p>\u003cp>The first diagnostic steps are:\u003c/p>\u003cpre>\u003ccode>kubectl logs my-pod --previous\nkubectl describe pod my-pod\u003c/code>\u003c/pre>\u003cp>The \u003ccode>--previous\u003c/code> flag matters because the current container may have just started and logged nothing, while the crashed instance holds the error. \u003ccode>describe\u003c/code> shows the last exit code and recent events.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Exit code\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Usual cause\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>Process finished\u003c/td>\u003ctd>A one-off script run as a long-lived service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Application error\u003c/td>\u003ctd>Bad config, missing env var, failed connection at startup\u003c/td>\u003c/tr>\u003ctr>\u003ctd>126\u003c/td>\u003ctd>Cannot execute\u003c/td>\u003ctd>A script without execute permission\u003c/td>\u003c/tr>\u003ctr>\u003ctd>127\u003c/td>\u003ctd>Command not found\u003c/td>\u003ctd>A shell entrypoint calling a missing program\u003c/td>\u003c/tr>\u003ctr>\u003ctd>137\u003c/td>\u003ctd>\u003ccode>SIGKILL\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#OOMKilled\" data-term=\"OOMKilled\">OOMKilled\u003c/a>, or a forced stop after a failed probe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>143\u003c/td>\u003ctd>\u003ccode>SIGTERM\u003c/code>\u003c/td>\u003ctd>Asked to stop, often by a failed \u003ca href=\"#Liveness%20probe\" data-term=\"Liveness probe\">liveness probe\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Exit code 0 can also produce this status. A \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> requires \u003ccode>restartPolicy: Always\u003c/code>, so a container that completes successfully is restarted. Use a Job (a workload that runs to completion) for one-off tasks.\u003c/p>\u003cp>If logs are empty, the runtime may have failed to start the command, which \u003ccode>describe\u003c/code> reports as a start error. Check the entrypoint and \u003ca href=\"#Container%20image\" data-term=\"Container image\">image\u003c/a> architecture, or debug with an ephemeral container through \u003ccode>kubectl debug\u003c/code>.\u003c/p>\u003cp>Restarting or deleting the Pod rarely helps, since the replacement hits the same failure.\u003c/p>","avoid":"","usage":["The new release is in CrashLoopBackOff and the logs are empty.","Run logs with \u003ccode>--previous\u003c/code>, you're looking at the fresh container. And check the exit code in describe."],"out":[18,10,20,32,29,21,11]},{"name":"Horizontal Pod Autoscaler","section":2,"description":"A Kubernetes controller that changes a workload's replica count based on CPU, memory, or custom metrics.","body":"\u003cp>A Horizontal \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> Autoscaler (HPA) is a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> controller that adjusts the number of Pod replicas in a workload, such as a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a>, according to observed metrics. &quot;Horizontal&quot; means adding or removing replicas, as opposed to giving each one more CPU or memory. By default it re-evaluates every 15 seconds using this calculation:\u003c/p>\u003cpre>\u003ccode>desired = ceil(current replicas × current metric / target metric)\u003c/code>\u003c/pre>\u003cp>With 4 replicas averaging 90% CPU against a 60% target, the result is \u003ccode>ceil(4 × 90 / 60) = 6\u003c/code>. The controller skips changes when the ratio of current to target is within 10% of 1.0, which prevents constant small adjustments.\u003c/p>\u003cpre>\u003ccode>apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: api\nspec:\n  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }\n  minReplicas: 3\n  maxReplicas: 20\n  metrics:\n    - type: Resource\n      resource:\n        name: cpu\n        target: { type: Utilization, averageUtilization: 60 }\u003c/code>\u003c/pre>\u003cp>CPU utilisation is calculated against the Pod's CPU request from its \u003ca href=\"#Resource%20requests%20and%20limits\" data-term=\"Resource requests and limits\">resource requests and limits\u003c/a>. If \u003ccode>kubectl get hpa\u003c/code> shows \u003ccode>&lt;unknown&gt;\u003c/code> as the current value and nothing scales, the usual cause is a missing CPU request or a missing metrics-server (the add-on that reports resource usage).\u003c/p>\u003cp>Other common problems:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Replicas reset on each deploy\u003c/td>\u003ctd>Manifest also sets \u003ccode>spec.replicas\u003c/code>\u003c/td>\u003ctd>Remove \u003ccode>replicas\u003c/code> from the manifest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slow to scale down\u003c/td>\u003ctd>Default five-minute stabilisation window\u003c/td>\u003ctd>Tune \u003ccode>behavior\u003c/code> if needed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>New Pods stay Pending\u003c/td>\u003ctd>Cluster has no spare node capacity\u003c/td>\u003ctd>Add a node autoscaler\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No scaling during overload\u003c/td>\u003ctd>Bottleneck is I/O, so CPU stays low\u003c/td>\u003ctd>Scale on queue depth or request rate\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The HPA reacts after load has already risen, and new Pods still need time to pull \u003ca href=\"#Container%20image\" data-term=\"Container image\">images\u003c/a> and pass their \u003ca href=\"#Readiness%20probe\" data-term=\"Readiness probe\">readiness probe\u003c/a>. For sharp spikes, keep \u003ccode>minReplicas\u003c/code> high enough to absorb the first wave.\u003c/p>","avoid":"","usage":["Traffic tripled and the HPA didn't add a single pod.","Its target says \u003ccode>&lt;unknown&gt;\u003c/code>. The \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> has no CPU request, so it has nothing to compute utilisation against."],"out":[20,18,21,31,11,30,10]},{"name":"Helm","section":2,"description":"A package manager for Kubernetes that renders templated manifests from values and tracks each install as a release.","body":"\u003cp>Helm is a package manager for \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a>. It bundles the manifests an application needs into a versioned package called a chart, fills in templates using configuration values, applies the result to a cluster, and records each install or upgrade so it can be reversed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Chart\u003c/td>\u003ctd>A package of templates, defaults, and metadata\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Values\u003c/td>\u003ctd>Configuration supplied to the templates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Template\u003c/td>\u003ctd>A manifest with placeholders, written in Go template syntax\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Release\u003c/td>\u003ctd>One installed instance of a chart in a cluster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revision\u003c/td>\u003ctd>A numbered version of a release\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repository\u003c/td>\u003ctd>A place that hosts charts, often an OCI \u003ca href=\"#Container%20registry\" data-term=\"Container registry\">container registry\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A template fragment looks like this:\u003c/p>\u003cpre>\u003ccode>spec:\n  replicas: {{ .Values.replicaCount }}\n  template:\n    spec:\n      containers:\n        - name: api\n          image: &quot;{{ .Values.image.repository }}:{{ .Values.image.tag }}&quot;\u003c/code>\u003c/pre>\u003cp>The same chart can then deploy to staging and production with a different values file. Charts carry a \u003ca href=\"#Semantic%20versioning\" data-term=\"Semantic versioning\">semantic version\u003c/a>, so a team can install third-party software at a known version.\u003c/p>\u003cp>Generating YAML through text templates has known failure modes. Wrong indentation produces invalid manifests, or valid ones with a field in the wrong place. A misspelled key in a values file is usually ignored without any warning, so an override appears to do nothing. Run \u003ccode>helm template\u003c/code> or \u003ccode>helm upgrade --dry-run\u003c/code> to inspect the rendered output before applying it.\u003c/p>\u003cp>A successful \u003ccode>helm upgrade\u003c/code> can also mislead. Without a wait option, Helm reports success once the API server accepts the resources, while the new \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> may be crashing. Use \u003ccode>--wait\u003c/code> with a timeout in \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipelines\u003c/a>, and \u003ccode>--rollback-on-failure\u003c/code> to undo a failed upgrade. Helm 3 calls this flag \u003ccode>--atomic\u003c/code>, and Helm 4 renamed it.\u003c/p>\u003cp>\u003ccode>helm rollback\u003c/code> restores an earlier revision's manifests by creating a new revision. It does not undo data changes. Helm stores release history in \u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Secrets\u003c/a> in the release's namespace by default, so deleting those Secrets makes Helm lose track of the release.\u003c/p>","avoid":"","usage":["I set \u003ccode>replicas: 5\u003c/code> in the values file, and it's still running two.","The chart reads \u003ccode>replicaCount\u003c/code>, so Helm ignored your key. Run \u003ccode>helm template\u003c/code> and check the output."],"out":[18,17,8,20,5,26]},{"name":"Kubernetes Operator","section":2,"description":"A custom Kubernetes controller that automates operating an application, driven by custom resource types.","body":"\u003cp>A \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> Operator is a custom controller that automates the operation of a specific application by extending the Kubernetes API. It encodes tasks a human administrator would otherwise perform, such as setting up replication, taking backups, handling failover, and running version upgrades.\u003c/p>\u003cp>An Operator has three parts:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CustomResourceDefinition (CRD)\u003c/td>\u003ctd>Adds a new object type to the Kubernetes API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custom resource\u003c/td>\u003ctd>An instance of that type, stating what you want\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controller\u003c/td>\u003ctd>Watches those objects and acts to make them true\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>With a PostgreSQL Operator such as CloudNativePG, a database cluster becomes one short manifest:\u003c/p>\u003cpre>\u003ccode>apiVersion: postgresql.cnpg.io/v1\nkind: Cluster\nmetadata:\n  name: orders-db\nspec:\n  instances: 3\n  storage:\n    size: 20Gi\u003c/code>\u003c/pre>\u003cp>The controller creates the \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a>, storage, and \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Services\u003c/a>, configures replication, and promotes a replica if the primary fails. It runs a reconcile loop, the same pattern built-in controllers use: read the desired state, inspect the actual state, and act on the difference.\u003c/p>\u003cp>Operators are useful for stateful software, where a \u003ca href=\"#StatefulSet\" data-term=\"StatefulSet\">StatefulSet\u003c/a> supplies identity and storage but knows nothing about the application's failover process. For a stateless app, a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> or \u003ca href=\"#Helm\" data-term=\"Helm\">Helm\u003c/a> chart is usually enough.\u003c/p>\u003cp>An Operator is extra software you must run and trust. It often holds broad cluster permissions, its CRDs need upgrading alongside it, and a bug in it acts automatically on production systems. If it stops running, nothing reconciles, so failover and repair stop too.\u003c/p>\u003cp>A recognisable failure comes from removing an Operator before its resources. Custom resources often carry a finalizer, a marker that blocks deletion until a controller finishes cleanup. With the controller gone, nothing clears the marker, and \u003ccode>kubectl delete\u003c/code> hangs with the object stuck in \u003ccode>Terminating\u003c/code>. Delete custom resources first, then uninstall the Operator. Removing a finalizer by hand skips that cleanup and can leave external resources behind.\u003c/p>","avoid":"","usage":["This custom resource has been stuck in Terminating since yesterday.","Its finalizer is waiting for the Kubernetes Operator, and someone uninstalled it first. Reinstall it so that it can finish the cleanup."],"out":[18,20,23,27,21,35]},{"name":"Service mesh","section":2,"description":"An infrastructure layer of proxies that handles encryption, retries, routing, and metrics for traffic between services.","body":"\u003cp>A service mesh is an infrastructure layer that handles network communication between services using proxies, so applications do not each implement that logic. Traffic passes through a proxy on the way in and out, and a central component configures all the proxies. Istio and Linkerd are examples.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>What the mesh does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mutual TLS\u003c/td>\u003ctd>Encrypts traffic and verifies both sides' identities\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Traffic routing\u003c/td>\u003ctd>Splits by weight, for example for a \u003ca href=\"#Canary%20release\" data-term=\"Canary release\">canary release\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reliability\u003c/td>\u003ctd>Applies retries, timeouts, and circuit breaking (cutting off a failing dependency)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Telemetry\u003c/td>\u003ctd>Reports request rate, errors, and latency per service\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A mesh has a data plane, the proxies that carry traffic, and its own control component, separate from the \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> \u003ca href=\"#Control%20plane\" data-term=\"Control plane\">control plane\u003c/a>. The traditional data plane injects a sidecar proxy \u003ca href=\"#Container\" data-term=\"Container\">container\u003c/a> into each \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a>. Newer designs, such as Istio's ambient mode, move much of the work to shared per-node proxies.\u003c/p>\u003cp>A mesh adds a hop to every call, proxy memory and CPU, and another system to upgrade and debug. Adopt one for a specific need, such as required encryption between many services. A few services can often manage with a library and a plain \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a>.\u003c/p>\u003cp>Sidecars have known startup and shutdown problems. An application that makes a network call before its proxy is ready fails at boot, which can look random. A Job (a workload that runs to completion) can hang because its main container finished while the sidecar kept running. Kubernetes native sidecars, declared as init containers with \u003ccode>restartPolicy: Always\u003c/code>, address both.\u003c/p>\u003cp>Retries also need coordination. If three layers each try a request three times, one failing call can become 27 attempts against a service that is already struggling.\u003c/p>","avoid":"","usage":["The app fails its first DB call on boot, but only since we added the service mesh.","The sidecar isn't ready when your app starts. Switch to native sidecars so the proxy comes up first."],"out":[49,18,19,10,20,23]},{"name":"Infrastructure as code","section":3,"description":"Defining servers, networks, and other infrastructure in version-controlled files that tools apply automatically.","body":"\u003cp>Infrastructure as code (IaC) is the practice of defining servers, networks, databases, and permissions in version-controlled files, then using a tool to create and update them. The files replace manual work in a cloud console. A change to infrastructure becomes a commit that can be reviewed, tested, and reverted.\u003c/p>\u003cp>It addresses a familiar situation: production was built by hand over several years, nobody knows why one firewall rule exists, and staging differs in ways no one can list. When someone has to rebuild after a failure, the only documentation is the running system. With IaC, the definition is written down and can be run again.\u003c/p>\u003cp>IaC tools take one of two approaches:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>You write\u003c/th>\u003cth>Tool's job\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Declarative\u003c/td>\u003ctd>The desired end state\u003c/td>\u003ctd>Work out the changes needed\u003c/td>\u003ctd>\u003ca href=\"#Terraform\" data-term=\"Terraform\">Terraform\u003c/a>, CloudFormation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Imperative\u003c/td>\u003ctd>The steps to perform\u003c/td>\u003ctd>Run those steps in order\u003c/td>\u003ctd>Shell scripts, cloud SDK calls\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Declarative tools are the usual choice because the same file can be applied repeatedly. If the infrastructure already matches, nothing happens. An imperative script that creates a server will often create a second one when it runs again, unless it is written to check first.\u003c/p>\u003cp>A typical workflow puts changes through a \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a>: open a pull request, generate a preview of what will change, have someone review that preview, and apply after merging. The preview matters, because a small edit can have a large effect, such as replacing a database. \u003ca href=\"#Policy%20as%20code\" data-term=\"Policy as code\">Policy as code\u003c/a> can check the preview automatically.\u003c/p>\u003cp>IaC only works while the code stays authoritative. Emergency edits in the console create \u003ca href=\"#Configuration%20drift\" data-term=\"Configuration drift\">configuration drift\u003c/a>, and the next apply may silently undo them. Credentials should also stay out of these files and come from \u003ca href=\"#Secrets%20management\" data-term=\"Secrets management\">secrets management\u003c/a>.\u003c/p>","avoid":"","usage":["How long would it take to recreate the staging VPC if someone deleted it?","Days, since it was all clicked together. We should bring it under infrastructure as code before we need to find out."],"out":[39,5,45,41,46]},{"name":"Terraform","section":3,"description":"A declarative infrastructure as code tool that compares configuration with recorded state and applies the difference.","body":"\u003cp>Terraform is a declarative \u003ca href=\"#Infrastructure%20as%20code\" data-term=\"Infrastructure as code\">infrastructure as code\u003c/a> tool from HashiCorp. You describe resources in HCL (HashiCorp Configuration Language), and Terraform works out what to create, change, or delete to reach that description. Plugins called providers connect it to AWS, Google Cloud, Azure, Cloudflare, and many other APIs. OpenTofu is an open-source fork with a largely compatible workflow.\u003c/p>\u003cpre>\u003ccode>resource &quot;aws_s3_bucket&quot; &quot;logs&quot; {\n  bucket = &quot;acme-app-logs&quot;\n\n  lifecycle {\n    prevent_destroy = true\n  }\n}\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>terraform init\u003c/code>\u003c/td>\u003ctd>Downloads providers and connects to the state backend\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>terraform plan\u003c/code>\u003c/td>\u003ctd>Shows the changes it would make, without making them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>terraform apply\u003c/code>\u003c/td>\u003ctd>Makes the changes after confirmation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>terraform destroy\u003c/code>\u003c/td>\u003ctd>Deletes everything the configuration manages\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>To build a plan, Terraform compares three things: your configuration, its record of what it manages in \u003ca href=\"#Terraform%20state\" data-term=\"Terraform state\">Terraform state\u003c/a>, and the real resources as reported by the provider. Differences found in the real resources are \u003ca href=\"#Configuration%20drift\" data-term=\"Configuration drift\">configuration drift\u003c/a>.\u003c/p>\u003cp>A plan can propose destroying a database after a small edit. Some attributes cannot be changed on an existing resource, so changing one means deleting and recreating it. The plan marks this as \u003ccode>-/+\u003c/code> with \u003ccode># forces replacement\u003c/code> beside the attribute. Renaming a resource block has a similar effect, because Terraform sees one resource removed and another added. A \u003ccode>moved\u003c/code> block tells it that the two are the same.\u003c/p>\u003cp>Read every plan before applying, especially lines containing \u003ccode>destroy\u003c/code> or \u003ccode>replace\u003c/code>. Apply the saved plan with \u003ccode>terraform plan -out=tfplan\u003c/code> followed by \u003ccode>terraform apply tfplan\u003c/code>, so that what was reviewed is what runs. Use \u003ccode>prevent_destroy\u003c/code> on resources that hold data. It makes any plan that would destroy the resource fail, although removing the block from the configuration removes that protection.\u003c/p>","avoid":"","usage":["Terraform wants to replace the production database. I only changed one setting.","That setting forces replacement. Stop before applying, and find a way to migrate it without recreating the instance."],"out":[38,40,41]},{"name":"Terraform state","section":3,"description":"The file where Terraform records which real resources it manages, mapping configuration to actual infrastructure IDs.","body":"\u003cp>\u003ca href=\"#Terraform\" data-term=\"Terraform\">Terraform\u003c/a> state is the data file in which Terraform records the real resources it manages. It maps each block in your configuration, such as \u003ccode>aws_instance.web\u003c/code>, to an actual ID in the provider, such as \u003ccode>i-0abc123\u003c/code>, along with the attributes last seen. Without this mapping, Terraform has no way to know that a server in your account belongs to a given block.\u003c/p>\u003cp>By default state is a local file called \u003ccode>terraform.tfstate\u003c/code>. Teams store it in a remote backend so that everyone works from the same copy:\u003c/p>\u003cpre>\u003ccode>terraform {\n  backend &quot;s3&quot; {\n    bucket       = &quot;acme-terraform-state&quot;\n    key          = &quot;prod/network.tfstate&quot;\n    region       = &quot;eu-west-1&quot;\n    encrypt      = true\n    use_lockfile = true\n  }\n}\u003c/code>\u003c/pre>\u003cp>Most state incidents fall into a few patterns:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>What you see\u003c/th>\u003cth>Response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>State lost\u003c/td>\u003ctd>Plan wants to create everything again\u003c/td>\u003ctd>Restore a backup, or import resources\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concurrent applies\u003c/td>\u003ctd>State lock error, or corruption if no locking\u003c/td>\u003ctd>Use locking, and run applies in a \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stale lock\u003c/td>\u003ctd>\u003ccode>Error acquiring the state lock\u003c/code> after a crash\u003c/td>\u003ctd>Confirm nothing is running, then \u003ccode>force-unlock\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resource renamed\u003c/td>\u003ctd>Plan shows destroy and create\u003c/td>\u003ctd>Add a \u003ccode>moved\u003c/code> block\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resource created by hand\u003c/td>\u003ctd>Terraform ignores it\u003c/td>\u003ctd>Bring it in with an \u003ccode>import\u003c/code> block\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>State often holds secrets. Database passwords and generated keys are stored in it in plain text, even when marked \u003ccode>sensitive\u003c/code> in the configuration, which only hides them from command output. Never commit it to Git. Keep it in an encrypted backend with restricted access, and treat read access to state as access to those credentials.\u003c/p>\u003cp>Enable versioning on the storage bucket, so that a damaged state file can be restored. Avoid hand-editing the file, and use \u003ccode>terraform state\u003c/code> subcommands when you need to change it. Splitting large projects into several smaller states also reduces the impact of a mistake and keeps plans fast.\u003c/p>","avoid":"","usage":["Terraform says it needs to create all 140 resources, but they already exist.","It's reading empty Terraform state. Check that the backend key is right before anyone applies anything."],"out":[39,5]},{"name":"Configuration drift","section":3,"description":"The gap that opens when live infrastructure no longer matches its declared configuration, often after manual changes.","body":"\u003cp>Configuration drift is the difference that develops between what your configuration declares and what is actually running. It usually starts with a reasonable action: during an incident, someone opens a port in the cloud console, edits a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Kubernetes Deployment\u003c/a> with \u003ccode>kubectl edit\u003c/code>, or changes a setting on one server over SSH. The fix works, and nobody updates the code.\u003c/p>\u003cp>Drift has two recognisable consequences. The first is a hotfix that disappears. Weeks later, someone runs a routine \u003ca href=\"#Terraform\" data-term=\"Terraform\">Terraform\u003c/a> apply, the tool restores the declared value, and the incident returns. The second is environments that behave differently for reasons no one can find, where a bug appears in production and cannot be reproduced in staging because their settings are no longer alike.\u003c/p>\u003cp>Detection depends on the layer:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>How to detect drift\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cloud resources\u003c/td>\u003ctd>A scheduled \u003ccode>terraform plan\u003c/code>, alerting on any non-empty result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a>\u003c/td>\u003ctd>A \u003ca href=\"#GitOps\" data-term=\"GitOps\">GitOps\u003c/a> controller reporting an out-of-sync state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Servers\u003c/td>\u003ctd>A \u003ca href=\"#Configuration%20management\" data-term=\"Configuration management\">configuration management\u003c/a> run in check mode\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Once found, each difference needs a decision:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Decision\u003c/th>\u003cth>When\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Adopt\u003c/td>\u003ctd>The live change is correct\u003c/td>\u003ctd>Update the code to match\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revert\u003c/td>\u003ctd>The live change was a mistake\u003c/td>\u003ctd>Apply the code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ignore\u003c/td>\u003ctd>Something else legitimately manages it\u003c/td>\u003ctd>Exclude the field, such as with \u003ccode>ignore_changes\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Some differences are expected. A \u003ca href=\"#Horizontal%20Pod%20Autoscaler\" data-term=\"Horizontal Pod Autoscaler\">Horizontal Pod Autoscaler\u003c/a> changes replica counts by design, so the replica field should not be owned by the manifest as well.\u003c/p>\u003cp>To prevent drift, restrict write access to production, keep a fast emergency route through the normal \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a>, and require a follow-up commit after any manual fix. \u003ca href=\"#Immutable%20infrastructure\" data-term=\"Immutable infrastructure\">Immutable infrastructure\u003c/a> reduces drift on servers because they are replaced instead of edited.\u003c/p>","avoid":"","usage":["The rate limit we raised during Friday's incident is back to the old value.","That was a console change, so it was configuration drift. Today's apply reverted it. Put the new value in the Terraform code."],"out":[21,39,18,43,44,34,5,42]},{"name":"Immutable infrastructure","section":3,"description":"An approach where servers and containers are never changed in place. Each change builds a new version and replaces the old.","body":"\u003cp>Immutable infrastructure is an approach in which running servers and \u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a> are never modified after they are deployed. To change anything, whether an application version, a package, or a setting, you build a new image and replace the old instances with it. The image can be a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a> or a virtual machine image built with a tool such as Packer.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Mutable\u003c/th>\u003cth>Immutable\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Applying a change\u003c/td>\u003ctd>Update the running server\u003c/td>\u003ctd>Build a new image and replace it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server history\u003c/td>\u003ctd>Accumulates over its lifetime\u003c/td>\u003ctd>Exactly what the image contains\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failed update\u003c/td>\u003ctd>Can leave a partial state\u003c/td>\u003ctd>New instance fails, old one remains\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Going back\u003c/td>\u003ctd>Reverse each change\u003c/td>\u003ctd>Redeploy the previous image\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The approach addresses the &quot;snowflake server&quot;, a machine that has been patched and adjusted by hand for years until nobody can recreate it, and everyone avoids rebooting it. Replacing instances routinely prevents that history from forming and removes most \u003ca href=\"#Configuration%20drift\" data-term=\"Configuration drift\">configuration drift\u003c/a> on the host.\u003c/p>\u003cp>Immutability has requirements. Anything that must survive replacement, such as uploaded files, databases, and logs, has to live outside the instance in external storage or a logging service. Build and deployment must be automated, because a small change now means a full build and rollout. Configuration that varies by environment is supplied at startup, so that one \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a> works everywhere.\u003c/p>\u003cp>Debugging habits also change. A fix patched onto a live server vanishes at the next deployment or scaling event, so it has to go into the image definition. A \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> means redeploying the previous image, provided data changes remain compatible. \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> works this way by default: changing a \u003ca href=\"#Pod\" data-term=\"Pod\">Pod\u003c/a> template creates new Pods and removes the old ones.\u003c/p>","avoid":"","usage":["I patched the config on that box last week. Why has the bug come back?","We run immutable infrastructure, so autoscaling replaced that instance. The fix needs to go in the image build."],"out":[10,11,41,6,51,18,20]},{"name":"GitOps","section":3,"description":"Operating systems from declarative config in Git, with an agent that continuously pulls it and reconciles the live state.","body":"\u003cp>GitOps is an operating model in which a Git repository holds the declared state of a system, and an automated agent continuously makes the live system match it. To change production, you merge a commit. Git supplies the review, audit history, and a way to revert, while the agent does the applying. Argo CD and Flux are common agents for \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a>.\u003c/p>\u003cp>The model differs from a traditional deployment \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> in the direction of access:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Push-based \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a>/CD\u003c/th>\u003cth>Pull-based GitOps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who applies\u003c/td>\u003ctd>The CI job\u003c/td>\u003ctd>An agent inside the cluster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Credentials\u003c/td>\u003ctd>CI holds cluster access\u003c/td>\u003ctd>Cluster holds read access to Git\u003c/td>\u003c/tr>\u003ctr>\u003ctd>When it runs\u003c/td>\u003ctd>Once, on a pipeline trigger\u003c/td>\u003ctd>Continuously\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Manual changes\u003c/td>\u003ctd>Remain until the next deploy\u003c/td>\u003ctd>Detected, and optionally reverted\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A typical flow has CI build and publish a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>, then update the image tag in a separate configuration repository. The agent sees the commit and rolls out the change. A \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> is usually a \u003ccode>git revert\u003c/code> of that commit.\u003c/p>\u003cp>Continuous reconciliation can revert manual changes. During an incident, someone runs \u003ccode>kubectl scale\u003c/code> or \u003ccode>kubectl edit\u003c/code>, sees the change take effect, and a minute later it is gone. With self-healing enabled, the agent treats the manual edit as \u003ca href=\"#Configuration%20drift\" data-term=\"Configuration drift\">configuration drift\u003c/a> and restores the Git version. To make an emergency change stick, commit it, or explicitly suspend syncing for that application and resume it afterwards.\u003c/p>\u003cp>Plain secrets cannot be stored in Git, so teams commit encrypted values or references to an external store through \u003ca href=\"#Secrets%20management\" data-term=\"Secrets management\">secrets management\u003c/a>. Fields changed by controllers, such as replica counts under a \u003ca href=\"#Horizontal%20Pod%20Autoscaler\" data-term=\"Horizontal Pod Autoscaler\">Horizontal Pod Autoscaler\u003c/a>, must be excluded or they will fight the agent.\u003c/p>","avoid":"","usage":["I scaled the API to ten replicas and it dropped back to four by itself.","Argo reverted it. We use GitOps, so the repo wins. Open a PR changing the replica count."],"out":[18,5,2,11,51,41,46,34]},{"name":"Configuration management","section":3,"description":"Using tools to install software and keep settings consistent on existing servers, such as with Ansible, Puppet, or Chef.","body":"\u003cp>Configuration management is the use of tools to install software, write config files, manage users, and keep services running on existing servers in a defined way. Instead of logging in to each machine, you describe the desired setup once and apply it across a fleet. Ansible, Puppet, Chef, and Salt are established examples.\u003c/p>\u003cpre>\u003ccode>- name: Ensure nginx is installed\n  ansible.builtin.apt:\n    name: nginx\n    state: present\n\n- name: Ensure nginx is running\n  ansible.builtin.service:\n    name: nginx\n    state: started\n    enabled: true\u003c/code>\u003c/pre>\u003cp>The important property is idempotence: running the same configuration many times gives the same result as running it once. The task above installs nginx only when it is missing. Compare a shell script containing \u003ccode>echo &quot;option&quot; &gt;&gt; app.conf\u003c/code>, which appends a duplicate line on every run until the service refuses to start or behaves strangely.\u003c/p>\u003cp>Tools differ in how changes reach a machine:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Push\u003c/td>\u003ctd>A control machine connects, often over SSH\u003c/td>\u003ctd>Ansible\u003c/td>\u003ctd>No agent, but runs only when triggered\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pull\u003c/td>\u003ctd>An agent on each server fetches its config\u003c/td>\u003ctd>Puppet, Chef\u003c/td>\u003ctd>Corrects drift regularly, but needs agents\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Configuration management is often confused with \u003ca href=\"#Infrastructure%20as%20code\" data-term=\"Infrastructure as code\">infrastructure as code\u003c/a> tools for provisioning. \u003ca href=\"#Terraform\" data-term=\"Terraform\">Terraform\u003c/a> typically creates the server, network, and disk, and configuration management sets up what runs inside the machine. The two are commonly used together.\u003c/p>\u003cp>These tools only manage what they are told to manage. A package installed by hand stays on the machine even after the playbook is corrected, so long-lived servers still gather \u003ca href=\"#Configuration%20drift\" data-term=\"Configuration drift\">configuration drift\u003c/a>. A run can also fail halfway through a fleet, leaving some hosts updated and others not.\u003c/p>\u003cp>\u003ca href=\"#Container\" data-term=\"Container\">Container\u003c/a>-based systems reduce the need for this work, because the software is baked into an \u003ca href=\"#Container%20image\" data-term=\"Container image\">image\u003c/a> and replaced under \u003ca href=\"#Immutable%20infrastructure\" data-term=\"Immutable infrastructure\">immutable infrastructure\u003c/a>. Configuration management remains useful for virtual machines, network devices, and building base images.\u003c/p>","avoid":"","usage":["Half the fleet has the new TLS settings and the other half doesn't.","The Ansible run stopped at host 40. It's idempotent, so fix the failure and run the configuration management playbook again."],"out":[38,39,41,10,11,42]},{"name":"Policy as code","section":3,"description":"Writing security and compliance rules as executable code that automatically checks and blocks infrastructure changes.","body":"\u003cp>Policy as code is the practice of writing organisational rules as machine-readable code, so that tools can evaluate changes against them automatically. Rules such as &quot;no public storage buckets&quot;, &quot;\u003ca href=\"#Container\" data-term=\"Container\">containers\u003c/a> must not run as root&quot;, or &quot;\u003ca href=\"#Container%20image\" data-term=\"Container image\">images\u003c/a> must come from our registry&quot; are versioned, reviewed, and tested in the same way as application code. Open Policy Agent (with its Rego language), Kyverno, and HashiCorp Sentinel are examples.\u003c/p>\u003cp>Written guidelines depend on someone remembering them during review. A policy engine gives the same answer every time and reports which rule failed.\u003c/p>\u003cp>The same rule can be enforced at several points:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Enforcement point\u003c/th>\u003cth>What is checked\u003c/th>\u003cth>Effect of a violation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Developer machine or PR\u003c/td>\u003ctd>Manifests and config files\u003c/td>\u003ctd>Early feedback\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Pipeline\" data-term=\"Pipeline\">Pipeline\u003c/a>\u003c/td>\u003ctd>A \u003ca href=\"#Terraform\" data-term=\"Terraform\">Terraform\u003c/a> plan or built image\u003c/td>\u003ctd>Blocks the merge or deploy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> admission\u003c/td>\u003ctd>Objects sent to the API server\u003c/td>\u003ctd>The API request is rejected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Runtime audit\u003c/td>\u003ctd>Resources that already exist\u003c/td>\u003ctd>Reports or remediates\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Earlier checks give faster feedback, while admission control is harder to bypass. An admission controller is a \u003ca href=\"#Control%20plane\" data-term=\"Control plane\">control plane\u003c/a> plugin that can inspect or modify a request before it is stored. Policy engines usually attach as admission webhooks, so a blocked deploy appears as an error such as \u003ccode>admission webhook &quot;...&quot; denied the request\u003c/code>.\u003c/p>\u003cp>A new rule in blocking mode can break existing deployments. Run it in audit mode first, fix or exempt what it would reject, then enforce it. Each policy should tell the developer how to comply.\u003c/p>\u003cp>Admission webhooks also add an availability risk. If a webhook is set to \u003ccode>failurePolicy: Fail\u003c/code> and its service goes down, every matching API request is refused, which can block new \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a>, including the replacement for the w
