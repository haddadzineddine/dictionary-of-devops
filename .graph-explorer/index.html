ebhook itself. Run it with multiple replicas, and exclude system namespaces.\u003c/p>","avoid":"","usage":["My deploy just got rejected by an admission webhook.","That's policy as code. The rule says containers can't run as root, so set \u003ccode>runAsNonRoot\u003c/code> and apply it again."],"out":[10,11,5,39,18,19,20]},{"name":"Secrets management","section":3,"description":"Storing, distributing, rotating, and auditing credentials such as passwords, API keys, and certificates.","body":"\u003cp>Secrets management is the practice of controlling credentials such as passwords, API keys, tokens, and certificates throughout their lifecycle. It covers storage, access, delivery to applications, rotation (replacing them with new values), and auditing. HashiCorp Vault, AWS Secrets Manager, and Google Secret Manager are examples of dedicated stores.\u003c/p>\u003cp>The typical failure is a credential committed to Git. Deleting it in a later commit does not help, because it remains in the repository's history and in every clone. Once a secret has been pushed, treat it as compromised: revoke it, issue a new one, and check the access logs. Secret scanners in pre-commit hooks and \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipelines\u003c/a> can catch many of these before they land.\u003c/p>\u003cp>Approaches form a ladder:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Approach\u003c/th>\u003cth>Remaining weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Hardcoded in source\u003c/td>\u003ctd>Visible to anyone with the code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ccode>.env\u003c/code> files on servers\u003c/td>\u003ctd>Copied around, rarely rotated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a> or platform secret store\u003c/td>\u003ctd>Long-lived, limited audit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Kubernetes Secret\u003c/a>, encrypted at rest\u003c/td>\u003ctd>Readable by anyone who can create \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> in the namespace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Central secrets manager\u003c/td>\u003ctd>Applications still hold static values\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Short-lived dynamic credentials\u003c/td>\u003ctd>Depends on the issuer being available\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Dynamic credentials are issued on demand and expire automatically, so a leaked value has a short useful life. With workload identity or OIDC federation (trading a signed identity token for temporary access), a CI job or Pod receives temporary cloud permissions without a stored credential.\u003c/p>\u003cp>Rotation fails when nobody knows which services use a key, so the first attempt causes an outage. Automate it, and support two valid credentials during the changeover.\u003c/p>\u003cp>Secrets also leak through less obvious channels: logs, error reports, \u003ca href=\"#Terraform%20state\" data-term=\"Terraform state\">Terraform state\u003c/a>, and \u003ca href=\"#Image%20layer\" data-term=\"Image layer\">image layers\u003c/a>. Inject values at runtime, and keep them out of builds and output.\u003c/p>","avoid":"","usage":["I removed the leaked AWS key in the next commit, so we're fine, right?","No, it's still in history. Revoke it now. Then move it into secrets management."],"out":[5,2,26,20,40,13]},{"name":"Rolling deployment","section":4,"description":"A release strategy that replaces instances in small batches, so the service stays available while two versions run together.","body":"\u003cp>A rolling deployment is a release strategy that replaces running instances of an application with a new version in small batches. Capacity stays mostly available throughout, and no second full environment is needed. It is the default update strategy for a \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Kubernetes Deployment\u003c/a>.\u003c/p>\u003cp>\u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> controls the pace with two settings. \u003ccode>maxSurge\u003c/code> is how many extra \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a> may exist above the desired count, and \u003ccode>maxUnavailable\u003c/code> is how many may be missing. With 4 replicas, \u003ccode>maxSurge: 1\u003c/code>, and \u003ccode>maxUnavailable: 0\u003c/code>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Old Pods\u003c/th>\u003cth>New Pods\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One new Pod starts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003ctd>It becomes ready, one old Pod leaves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>3\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Next new Pod starts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>It becomes ready, one old Pod leaves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>0\u003c/td>\u003ctd>4\u003c/td>\u003ctd>The pattern repeats until complete\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Two versions serve traffic at the same time during the rollout, which causes intermittent errors that appear only during deploys. A page from the new version calls an API endpoint, the call lands on an old Pod that lacks it, and the request fails until a refresh. Each release must stay compatible with the one before it, which is the purpose of \u003ca href=\"#Expand%20and%20contract\" data-term=\"Expand and contract\">expand and contract\u003c/a>.\u003c/p>\u003cp>Two details prevent dropped requests. A \u003ca href=\"#Readiness%20probe\" data-term=\"Readiness probe\">readiness probe\u003c/a> keeps traffic away from a new Pod until it can serve. Graceful shutdown lets an old Pod finish in-flight requests after \u003ccode>SIGTERM\u003c/code>, before the grace period (30 seconds by default) ends in \u003ccode>SIGKILL\u003c/code>.\u003c/p>\u003cp>A \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> is another rolling update in the opposite direction, so it takes time. For an instant switch, use a \u003ca href=\"#Blue-green%20deployment\" data-term=\"Blue-green deployment\">blue-green deployment\u003c/a>. To measure impact on a small share of traffic first, use a \u003ca href=\"#Canary%20release\" data-term=\"Canary release\">canary release\u003c/a>.\u003c/p>","avoid":"","usage":["We get a handful of 404s from the API on every deploy, then they stop.","During the rolling deployment, new frontends hit old backends. Ship the endpoint first, then the frontend that calls it."],"out":[21,18,20,52,30,51,48,49]},{"name":"Blue-green deployment","section":4,"description":"A release strategy that runs two full environments and switches all traffic from the old version to the new at once.","body":"\u003cp>A blue-green deployment is a release strategy that keeps two production environments and moves traffic between them in one switch. &quot;Blue&quot; runs the current version and receives all traffic. &quot;Green&quot; gets the new version and is tested while idle. When it looks correct, a router or load balancer (a component that spreads traffic across servers) points everyone at green.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Blue\u003c/th>\u003cth>Green\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Live\u003c/td>\u003ctd>Idle\u003c/td>\u003ctd>Deploy the new version to green\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Live\u003c/td>\u003ctd>Under test\u003c/td>\u003ctd>Run smoke tests against green directly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Idle\u003c/td>\u003ctd>Live\u003c/td>\u003ctd>Switch traffic to green\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Idle, on standby\u003c/td>\u003ctd>Live\u003c/td>\u003ctd>Watch metrics, keep blue running\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Next target\u003c/td>\u003ctd>Live\u003c/td>\u003ctd>Blue becomes the next release target\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main benefit is a fast \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a>: if green misbehaves, the router points back at blue, with no rebuild or redeploy. Unlike a \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployment\u003c/a>, users do not see a long period with two versions mixed. In \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a>, one simple form runs two \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployments\u003c/a> and changes the label selector on a \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Service\u003c/a>.\u003c/p>\u003cp>Both environments typically share one database, which limits rollback. If green's release drops or renames a column, switching back to blue fails. Schema changes need to work with both versions, using \u003ca href=\"#Expand%20and%20contract\" data-term=\"Expand and contract\">expand and contract\u003c/a>.\u003c/p>\u003cp>The switch also has side effects:\u003c/p>\u003cul>\u003cli>Green starts with cold caches, so latency can jump after the cutover.\u003c/li>\u003cli>Existing long-lived connections, such as WebSockets, may stay on blue until they are closed.\u003c/li>\u003cli>DNS-based switching is slow and uneven, because clients cache old answers.\u003c/li>\u003cli>Background workers in both environments may process the same jobs unless one is paused.\u003c/li>\u003c/ul>\u003cp>Running two full environments can double compute cost, so many teams create green on demand and remove it afterwards.\u003c/p>","avoid":"","usage":["Green's error rate just doubled after the cutover.","Flip the load balancer back to blue. That's why we keep it running after a blue-green deployment."],"out":[51,47,18,21,23,52]},{"name":"Canary release","section":4,"description":"A release strategy that sends a small share of real traffic to a new version and widens it only if metrics stay healthy.","body":"\u003cp>A canary release is a release strategy that sends a small share of real production traffic to a new version, compares its behaviour with the current version, and increases the share only if it stays healthy. If it degrades, traffic returns to the old version, so the failure affects a small group of users.\u003c/p>\u003cp>A typical progression looks like this, though the percentages and timings vary:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Traffic to new version\u003c/th>\u003cth>Hold\u003c/th>\u003cth>Promote if\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1%\u003c/td>\u003ctd>10 minutes\u003c/td>\u003ctd>Errors and latency match baseline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>10%\u003c/td>\u003ctd>30 minutes\u003c/td>\u003ctd>Same, plus key business metrics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>50%\u003c/td>\u003ctd>30 minutes\u003c/td>\u003ctd>Same\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>100%\u003c/td>\u003ctd>Done\u003c/td>\u003ctd>Old version removed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A canary catches problems that tests miss, because real traffic has data, clients, and load patterns that staging lacks. It only helps if someone defines what &quot;healthy&quot; means before the release. Compare the canary with a baseline running the old version at the same moment, because comparing against yesterday's numbers mixes in normal traffic changes. Tools such as Argo Rollouts and Flagger can automate promotion and \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> based on these metrics.\u003c/p>\u003cp>Traffic splitting needs some care. A plain \u003ca href=\"#Kubernetes%20Service\" data-term=\"Kubernetes Service\">Kubernetes Service\u003c/a> spreads connections across \u003ca href=\"#Pod\" data-term=\"Pod\">Pods\u003c/a>, so a percentage can only be approximated by the replica ratio, such as one canary in ten Pods. Exact weights need an \u003ca href=\"#Ingress\" data-term=\"Ingress\">Ingress\u003c/a> controller or \u003ca href=\"#Service%20mesh\" data-term=\"Service mesh\">service mesh\u003c/a> that supports them.\u003c/p>\u003cp>Small canaries have blind spots. At 1% on a quiet service, there may be too few requests for a problem to show up, and slow failures such as memory leaks can outlast the hold time. Assign users consistently, so that one person does not bounce between versions. As in a \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployment\u003c/a>, both versions must work with the same database.\u003c/p>","avoid":"","usage":["Should we ship the new ranking model to everyone tonight?","Do a canary release at 5% first and compare error rate and checkout conversion against the baseline for an hour."],"out":[51,23,20,24,37,47]},{"name":"Dark launch","section":4,"description":"Running new code in production against real traffic or data, while users continue to see only the existing behaviour.","body":"\u003cp>A dark launch is the release of new code to production so that it runs against real traffic or data while users continue to see the existing behaviour. The new path does its work, but its output is discarded or logged for comparison. This tests performance and correctness under production conditions before anyone depends on the result.\u003c/p>\u003cp>A common form is shadow traffic. The service handles each request as usual and also sends a copy to the new implementation asynchronously. The user receives the old response, while engineers compare the two responses and watch the new system's latency and error rate. A \u003ca href=\"#Feature%20flag\" data-term=\"Feature flag\">feature flag\u003c/a> often controls which requests are mirrored, and a \u003ca href=\"#Service%20mesh\" data-term=\"Service mesh\">service mesh\u003c/a> can mirror them at the network level.\u003c/p>\u003cp>Dark launches are often confused with neighbouring strategies:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>Runs in production?\u003c/th>\u003cth>Do users see the result?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dark launch\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Canary%20release\" data-term=\"Canary release\">Canary release\u003c/a>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>A small share of users\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Feature flag rollout\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Chosen users\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The technique suits risky backend replacements, such as a rewritten pricing engine or a new search index, because staging rarely reproduces real data shapes and volume.\u003c/p>\u003cp>Side effects are the main hazard. If a mirrored request sends an email, charges a card, or writes to a shared database, it happens twice, and customers see duplicates from a feature meant to be invisible. Stub out writes and external calls in the dark path, or point them at isolated storage.\u003c/p>\u003cp>Dark traffic is also real load, and extra calls to a shared dependency can slow the live path. Sample a small percentage first, send copies with strict timeouts, and keep a way to turn mirroring off. Remove the comparison code after launch.\u003c/p>","avoid":"","usage":["How do we know the new pricing engine handles real orders?","Dark launch it. Mirror 10% of requests, discard its output, and diff its prices against the old engine for a week."],"out":[9,37,49]},{"name":"Rollback","section":4,"description":"Returning a system to a previous known-good version after a bad release. It restores code, but not necessarily data.","body":"\u003cp>A rollback is the act of returning a system to a previous known-good version after a release causes problems. It is usually a quick way to restore service, because it reuses something that has already run in production.\u003c/p>\u003cp>The available method depends on how the release was made:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Typical speed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Feature%20flag\" data-term=\"Feature flag\">Feature flag\u003c/a> off\u003c/td>\u003ctd>Disables the code path with no deploy\u003c/td>\u003ctd>Seconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Traffic switch\u003c/td>\u003ctd>Points back at the old \u003ca href=\"#Blue-green%20deployment\" data-term=\"Blue-green deployment\">blue-green\u003c/a> environment\u003c/td>\u003ctd>Seconds to minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abort a \u003ca href=\"#Canary%20release\" data-term=\"Canary release\">canary\u003c/a>\u003c/td>\u003ctd>Returns the traffic share to the old version\u003c/td>\u003ctd>Seconds to minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Redeploy old artifact\u003c/td>\u003ctd>Rolls out the previous \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a>\u003c/td>\u003ctd>Minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>kubectl rollout undo\u003c/code>\u003c/td>\u003ctd>Restores the previous \u003ca href=\"#Kubernetes%20Deployment\" data-term=\"Kubernetes Deployment\">Deployment\u003c/a> revision\u003c/td>\u003ctd>Minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>git revert\u003c/code> with \u003ca href=\"#GitOps\" data-term=\"GitOps\">GitOps\u003c/a>\u003c/td>\u003ctd>Reverts the commit and lets the agent sync\u003c/td>\u003ctd>Minutes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A rollback sometimes fails to fix the incident. The old code is running again and errors continue, because the release changed something other than code. Common causes:\u003c/p>\u003cul>\u003cli>A database migration dropped or rewrote a column that the old version needs.\u003c/li>\u003cli>New code already wrote data in a format the old code cannot read.\u003c/li>\u003cli>A \u003ca href=\"#ConfigMap\" data-term=\"ConfigMap\">ConfigMap\u003c/a>, \u003ca href=\"#Kubernetes%20Secret\" data-term=\"Kubernetes Secret\">Secret\u003c/a>, or infrastructure change is not versioned with the release.\u003c/li>\u003cli>The real cause was never the release, such as a failing dependency or a traffic spike.\u003c/li>\u003cli>The previous artifact was deleted by a retention policy.\u003c/li>\u003c/ul>\u003cp>Plan for this before release: keep schema changes backward compatible using \u003ca href=\"#Expand%20and%20contract\" data-term=\"Expand and contract\">expand and contract\u003c/a>, retain recent artifacts, and rehearse the procedure.\u003c/p>\u003cp>Rolling forward, meaning shipping a fix as a new version, can be safer when the fix is small and understood, or when data has changed so that old code cannot run.\u003c/p>","avoid":"","usage":["We rolled back twenty minutes ago and checkout is still failing.","Then it isn't only the code. That release ran a migration, so the rollback put old code on the new schema."],"out":[9,48,49,6,21,43,25,26,52]},{"name":"Expand and contract","section":4,"description":"A way to make breaking schema or API changes in compatible steps, adding the new form before removing the old.","body":"\u003cp>Expand and contract, also called parallel change, is a way to make a breaking change to a database schema or API through a series of compatible steps. You first add the new form alongside the old one, move everything across, and remove the old form only when nothing uses it. Old and new application versions keep working at every step.\u003c/p>\u003cp>The technique exists because deployments are not instantaneous. During a \u003ca href=\"#Rolling%20deployment\" data-term=\"Rolling deployment\">rolling deployment\u003c/a>, old and new code run at the same time against one database. If a release renames \u003ccode>name\u003c/code> to \u003ccode>full_name\u003c/code> in a single migration, every old instance starts failing with &quot;column does not exist&quot; the moment the migration runs. Reversing the application with a \u003ca href=\"#Rollback\" data-term=\"Rollback\">rollback\u003c/a> does not help, because the old code needs a column that is gone.\u003c/p>\u003cp>Renaming that column safely takes several releases:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Phase\u003c/th>\u003cth>Change\u003c/th>\u003cth>Safe to roll back?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Expand\u003c/td>\u003ctd>Add nullable \u003ccode>full_name\u003c/code> column\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Migrate\u003c/td>\u003ctd>Deploy code that writes to both columns\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Migrate\u003c/td>\u003ctd>Backfill existing rows in small batches\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Migrate\u003c/td>\u003ctd>Deploy code that reads from \u003ccode>full_name\u003c/code>\u003c/td>\u003ctd>Yes, still dual-writing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Migrate\u003c/td>\u003ctd>Deploy code that writes only \u003ccode>full_name\u003c/code>\u003c/td>\u003ctd>To step 4. Earlier needs a re-sync\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Contract\u003c/td>\u003ctd>Drop \u003ccode>name\u003c/code> after confirming nothing uses it\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Step 6 is the only destructive change and can wait until the team is confident. Verify the backfill first, and check for other readers such as reports and scheduled jobs.\u003c/p>\u003cp>The same pattern applies to APIs: add the new field, migrate clients, then remove the old one. \u003ca href=\"#Continuous%20deployment\" data-term=\"Continuous deployment\">Continuous deployment\u003c/a> depends on this pattern, at the cost of more releases and temporary dual-write code.\u003c/p>","avoid":"","usage":["Can I rename this column in today's migration?","Not in one step, because the old \u003ca href=\"#Pod\" data-term=\"Pod\">pods\u003c/a> will crash mid-deploy. Use expand and contract: add the new column first and drop the old one next week."],"out":[47,51,4,20]},{"name":"Software supply chain","section":5,"description":"Everything that goes into building and shipping software, including dependencies, tools, pipelines, images, and registries.","body":"\u003cp>The software supply chain is everything involved in producing and delivering a piece of software: source code, third-party dependencies, base \u003ca href=\"#Container%20image\" data-term=\"Container image\">images\u003c/a>, compilers, \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipelines\u003c/a>, registries, and deployment tools. Your application inherits the trust of each link. Installing one package can pull in many others that nobody on the team chose directly.\u003c/p>\u003cp>A supply chain attack compromises one of those links instead of the application. The malicious code then arrives through a normal, trusted update, with no vulnerability in your own code:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Defence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Typosquatting\u003c/td>\u003ctd>Publishes a package with a name close to a popular one\u003c/td>\u003ctd>Review new dependencies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dependency confusion\u003c/td>\u003ctd>Public package shadows an internal name\u003c/td>\u003ctd>Scoped names, a controlled \u003ca href=\"#Artifact%20registry\" data-term=\"Artifact registry\">artifact registry\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maintainer takeover\u003c/td>\u003ctd>A trusted package gets a malicious release\u003c/td>\u003ctd>\u003ca href=\"#Dependency%20pinning\" data-term=\"Dependency pinning\">Dependency pinning\u003c/a>, delayed updates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Install scripts\u003c/td>\u003ctd>Package runs code during installation\u003c/td>\u003ctd>Disable scripts where possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a> compromise\u003c/td>\u003ctd>Attacker steals pipeline secrets or alters the build\u003c/td>\u003ctd>Least privilege, pinned CI actions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tampered artifact\u003c/td>\u003ctd>Image or package is altered after the build\u003c/td>\u003ctd>Signing and digest verification\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Defences work in layers. Know what you ship, using an \u003ca href=\"#SBOM\" data-term=\"SBOM\">SBOM\u003c/a>. Find known flaws with \u003ca href=\"#Image%20scanning\" data-term=\"Image scanning\">image scanning\u003c/a> and dependency audits. Control what enters the build with pinned versions and a proxy registry. Prove where artifacts came from through signing, with a tool such as Sigstore's cosign, and through provenance, which is a signed record of how and from what an artifact was built. The SLSA framework (Supply-chain Levels for Software Artifacts) defines progressive levels for build integrity.\u003c/p>\u003cp>A signature has no effect unless something checks it, so verify it at deploy time, for example with \u003ca href=\"#Policy%20as%20code\" data-term=\"Policy as code\">policy as code\u003c/a> in a \u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> admission controller.\u003c/p>","avoid":"","usage":["Why does the build need network access to run a postinstall script from some transitive package?","It doesn't, and that's a software supply chain risk. Disable install scripts in CI and allowlist the few that need them."],"out":[11,5,7,54,2,55,56,45,18]},{"name":"Dependency pinning","section":5,"description":"Fixing dependencies to exact versions or hashes so that every build uses the same inputs and updates happen deliberately.","body":"\u003cp>Dependency pinning is the practice of fixing each dependency to an exact version or content hash, so that a build uses the same inputs every time. Without it, a version range or moving tag can resolve to something new between two builds.\u003c/p>\u003cp>The familiar symptom is a build that passed on Friday and fails on Monday with no commits in between. A package several levels down published a new release, the range accepted it, and CI picked it up. \u003ca href=\"#Semantic%20versioning\" data-term=\"Semantic versioning\">Semantic versioning\u003c/a> ranges rely on maintainers classifying each change correctly, and on nobody publishing a malicious update.\u003c/p>\u003cp>Pinning has several levels of strength:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Example\u003c/th>\u003cth>What it guarantees\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Range\u003c/td>\u003ctd>\u003ccode>&quot;express&quot;: &quot;^4.18.0&quot;\u003c/code>\u003c/td>\u003ctd>Compatible versions, by convention\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exact version\u003c/td>\u003ctd>\u003ccode>&quot;express&quot;: &quot;4.18.2&quot;\u003c/code>\u003c/td>\u003ctd>That package only, not its dependencies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lockfile\u003c/td>\u003ctd>\u003ccode>package-lock.json\u003c/code>, \u003ccode>poetry.lock\u003c/code>\u003c/td>\u003ctd>The full dependency tree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content hash\u003c/td>\u003ctd>\u003ccode>integrity: sha512-...\u003c/code>\u003c/td>\u003ctd>The exact bytes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Commit the lockfile and install from it in CI. \u003ccode>npm ci\u003c/code>, for example, installs precisely what the lockfile says and fails if it disagrees with \u003ccode>package.json\u003c/code>, while \u003ccode>npm install\u003c/code> may update it.\u003c/p>\u003cp>The same rule applies beyond language packages. A \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a> tag can be moved, so pin a base image by digest. Pin CI actions to a full commit SHA, because a tag such as \u003ccode>v4\u003c/code> can be repointed:\u003c/p>\u003cpre>\u003ccode>FROM node:22-slim@sha256:&lt;digest&gt;\u003c/code>\u003c/pre>\u003cpre>\u003ccode>- uses: actions/checkout@&lt;full-commit-sha&gt; # v4\u003c/code>\u003c/pre>\u003cp>Pinning protects the \u003ca href=\"#Software%20supply%20chain\" data-term=\"Software supply chain\">software supply chain\u003c/a> from unexpected changes, but it also stops security fixes arriving automatically. Tools such as Renovate and Dependabot address this by opening regular pull requests that bump versions and run through \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">continuous integration\u003c/a>. A short delay before adopting new releases gives others time to spot a bad one.\u003c/p>","avoid":"","usage":["Nobody touched the repo over the weekend, but the build is red.","The \u003ca href=\"#Dockerfile\" data-term=\"Dockerfile\">Dockerfile\u003c/a> runs \u003ccode>npm install\u003c/code> with no lockfile, so a transitive package moved. Add dependency pinning and switch to \u003ccode>npm ci\u003c/code>."],"out":[8,11,53,2,12]},{"name":"SBOM","section":5,"description":"A software bill of materials, a machine-readable inventory of the components and versions inside a piece of software.","body":"\u003cp>An SBOM (software bill of materials) is a machine-readable inventory of the components inside a piece of software. For each package it typically records the name, version, supplier, license, a unique identifier, and how components depend on each other. It works like an ingredient list for a \u003ca href=\"#Build%20artifact\" data-term=\"Build artifact\">build artifact\u003c/a> or \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a>.\u003c/p>\u003cp>The practical case for one appears when a serious vulnerability is announced in a widely used library. The immediate question is &quot;are we affected, and where?&quot;. Without an inventory, engineers search repositories by hand and still miss copies pulled in several levels down or bundled inside a vendor's image. With SBOMs stored for every release, the answer is a query across existing data.\u003c/p>\u003cp>Two standard formats are in common use:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Format\u003c/th>\u003cth>Maintained by\u003c/th>\u003cth>Origin and emphasis\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SPDX\u003c/td>\u003ctd>Linux Foundation\u003c/td>\u003ctd>Began with license compliance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CycloneDX\u003c/td>\u003ctd>OWASP\u003c/td>\u003ctd>Began with application security\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Tools such as Syft and Trivy can generate either format. Generate the SBOM in the \u003ca href=\"#Pipeline\" data-term=\"Pipeline\">pipeline\u003c/a> at build time, from the final artifact when possible, because a source repository does not show what the base image added. Store it with the artifact and sign it, so that it can be tied to one specific build as part of the \u003ca href=\"#Software%20supply%20chain\" data-term=\"Software supply chain\">software supply chain\u003c/a>.\u003c/p>\u003cp>An SBOM says a component is present, without saying whether the vulnerable function is ever called. A companion format, VEX (Vulnerability Exploitability eXchange), lets a supplier state whether a product is affected by a given flaw. Generators can also miss statically linked libraries, copied source files, and binaries downloaded during a build.\u003c/p>\u003cp>The list of known vulnerabilities grows after a build, so stored SBOMs should be re-checked regularly, using the same vulnerability data as \u003ca href=\"#Image%20scanning\" data-term=\"Image scanning\">image scanning\u003c/a>.\u003c/p>","avoid":"","usage":["A critical CVE just dropped in that XML library. Do we ship it anywhere?","Query the SBOMs for every production release. That'll list the affected services without us grepping all the repos."],"out":[6,11,5,53,56]},{"name":"Image scanning","section":5,"description":"Automatically checking a container image's packages against databases of known vulnerabilities.","body":"\u003cp>Image scanning is the automated inspection of a \u003ca href=\"#Container%20image\" data-term=\"Container image\">container image\u003c/a> to find known security problems. A scanner identifies the operating system packages and application libraries in each \u003ca href=\"#Image%20layer\" data-term=\"Image layer\">image layer\u003c/a>, then compares their versions against vulnerability databases, reporting matches as CVEs (public identifiers for known flaws). Trivy, Grype, and the scanners built into many \u003ca href=\"#Container%20registry\" data-term=\"Container registry\">container registries\u003c/a> are examples.\u003c/p>\u003cp>Scans can run at several points:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Where\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Developer machine\u003c/td>\u003ctd>Early feedback before pushing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Pipeline\" data-term=\"Pipeline\">Pipeline\u003c/a>\u003c/td>\u003ctd>Block a build that fails the threshold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Registry\u003c/td>\u003ctd>Scan on push, and rescan stored images\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Kubernetes\" data-term=\"Kubernetes\">Kubernetes\u003c/a> admission\u003c/td>\u003ctd>Reject images without a passing result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Running workloads\u003c/td>\u003ctd>Find newly disclosed issues in production\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Rescanning matters because an image that was clean last month can show a critical finding today, when a flaw is disclosed in a package it already contains.\u003c/p>\u003cp>Teams adopting a scanner usually meet alert fatigue first. The initial report on a full-distribution base image can list hundreds of findings, many with no available fix or in code the application never runs. If the pipeline blocks on all of them, developers learn to bypass it. A workable gate fails only on high or critical findings that have a fix available, with time-limited exceptions for the rest.\u003c/p>\u003cp>To reduce findings, use a slim or distroless base through a \u003ca href=\"#Multi-stage%20build\" data-term=\"Multi-stage build\">multi-stage build\u003c/a>, and rebuild regularly. If the base uses \u003ca href=\"#Dependency%20pinning\" data-term=\"Dependency pinning\">dependency pinning\u003c/a>, update the pin, or the rebuild picks up no fixes.\u003c/p>\u003cp>Linux distributions often backport fixes without changing the upstream version number, which can produce false positives in tools that ignore distribution advisories. A clean scan covers only known issues in detected components. It does not find flaws in your own code or zero-day vulnerabilities (flaws not yet public).\u003c/p>","avoid":"","usage":["The scanner reports 312 CVEs and \u003ca href=\"#Continuous%20integration\" data-term=\"Continuous integration\">CI\u003c/a> is blocked.","Most are in the full Debian base. Move to a slim image, then have image scanning fail only on fixable criticals."],"out":[11,13,17,5,18,14,54,2]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
